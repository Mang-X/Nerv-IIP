  script-governance:
    name: Script Governance
    # 层级 B（失败后没有 step 继续运行）。已纳入证据 contract-test step 的 run 中，观测最大值为 1.9m /
    # 平均值为 1.8m；本注释曾引用的 0.7m 平均值早于该 step。10m job 预算是快速失败界限；step 预算
    # 合计为 43m，且仅为逐 step 上限。MAN-669 PR-C 添加了两个 solution-configuration-membership step；
    # 两者在本地均于 5s 内运行（checker 为 0.8s，其 contract test 为 3.6s），因此 job 预算不变。
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
