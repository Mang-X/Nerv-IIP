name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 超时策略（MAN-799，针对 MAN-669 分片拓扑重新推导）。每个 job 均声明
  # `timeout-minutes`，每个显式 step 也声明一个。除此之外分为两个层级，因为
  # “保护证据”仅适用于有证据可保护的地方：
  #
  #   A) 带 `if: always()` 证据 step 的 job——四个 backend 分片，以及
  #      erp-sales-order-demand-acceptance、connector-host-tests 和
  #      frontend-unit-test-shards：
  #          sum(step timeout-minutes) < job timeout-minutes.
  #      job 级超时会取消*整个* job，包括 `if: always()` step，并会
  #      连同 MAN-661 test-evidence 产物一起中断；step 级超时只会使该
  #      step 失败，因此 job 会继续进入 `Collect …` / `Upload …`。严格不等式
  #      保证某个 step 预算先触发。仅当*每个*显式 step 都有
  #      预算（包括证据收集/上传）时，它才成立。剩余余量（job − sum）还必须
  #      吸收 GitHub 隐式的 `Set up job` 和 post step；它们不在 `steps:` 中，也不能
  #      设置 `timeout-minutes`；post step 在 Upload *之后*运行，因此会消耗预算，但
  #      永远不会让证据丢失。在此新增 step 意味着增加该 step 的预算，*同时*提高 job
  #      预算。以下每个分片 job 正是为此保留 6 分钟余量。
  #
  #   B) 不含失败后仍可运行 step 的 job——`Backend Tests` 聚合、
  #      backend-test-shard-governance、frontend 聚合/validation、openapi-client-drift、script-governance：不会有任何内容
  #      在 job 预算触发时丢失，因此预算*不会*为了超过 step 总和而抬高。
  #      此处 **job** 预算是根据观测运行时长确定的快速失败界限。step 预算
  #      仅为逐 step 上限：当一个 job 含多个 step 时，靠后的 step 无法
  #      分别触达，对此明确接受，而非作出相反声明。唯一
  #      强制的是在任何调度下都不可能生效的情形——step 预算大于或等于
  #      整个 job 预算。
  #
  # 四个 backend 快速分片采用同一份共享测试 step 预算，按最大值的 ~2x 确定，该最大值
  # 从全部四个分片整体观测得出（而非逐分片）。短时固定成本 step（checkout、SDK setup、cache
  # restore、evidence collect/upload）设置 3–8 分钟下限，健康 run 远不会接近该值。
  #
  # MAN-669 PR-A 重新归置了分片内容，因此四个分片不再具有四种不同的
  # 形态，也不再采用四种不同预算。旧的差异（8m / 10m / 15m / 12m）
  # 按重平衡前的拆分确定：一个分片的 TRX elapsed 为 357s，另一个为 23s；
  # 该拓扑已不存在，而跨拓扑变更继承的预算
  # 不代表任何含义。**每个分片拥有的 project 仅由 scripts/backend-test-shards.json 定义**——
  # 这些注释有意不复述该列表，因为下次
  # 重新平衡分片时，复述的列表就会漂移。
  #
  # 此次重平衡的一项权重输入并未保留下来。记录于此，确保下次调整
  # 不会继承它：business-core-b（backend-shard-4）被赋予最低 TRX 份额，因为它
  # 在重平衡前的 run 30999368607 中拥有最差的 step-to-TRX 比率——265s step 对 191.7s TRX，
  # 比率为 1.38，而 business-core-a 为 372s/357.5s = 1.04。该比率描述的 project 集合
  # 已不存在：重平衡移出了该分片 9 个 project 中的 7 个，而 step-minus-TRX
  # 是依赖闭包的 restore/build 成本，它随 project 移动，而不随
  # lane 标签移动。重平衡后，在两个分片均产生读数的三次 run 中
  # （31114441118、31115903098、31118427925），business-core-b 是四者中*最快*的分片
  # （144s / 196s / 142s test step），而 business-core-a 是 critical path（249s / 252s / 234s）——
  # 该分片被过度减轻，而非正确减轻。差距落在 runner 方差范围内，因此
  # PR-A 不重新切分；但下一次重平衡（MAN-664）必须根据
  # 重平衡后的测量重新推导权重，且绝不能继续沿用 1.38。
  #
  # 根据本分支三次 run（31114441118、31115903098、31116998822）重新推导。每个分片的
  # test step 依次为 3.5m / 3.0m / 4.2m / 2.4m，然后为 4.5m / 3.0m / 4.2m / 3.3m，然后为 4.7m / 3.1m /
  # (setup-failed) / 3.1m；TRX elapsed 为 129.8s / 150.6s / 164.5s / 112.9s，然后为 215.5 / 144.5 /
  # 139.6 / 130.2，然后为 177.4 / 133.6 / — / 129.1。由此得出两点。Hosted-runner 在
  # *同一 commit* 上的方差达到数十个百分点，并会改变哪个分片居首，因此逐分片预算
  # 只会编码噪声——四者采用同一预算。该界限按观测范围内的最大值确定，而观测范围是
  # 这三次 run，最大值为 4.7m。因此，对全部四个分片同样有：
  #
  #     checkout 3 + setup-dotnet 5 + cache 8 + resolve-evidence 3
  #       + test 10 + collect 5 + upload 5  =  39m step sum  <  45m job budget  (6m margin)
  #
  # 该算术是上述层级 A 的义务；变更任何一个数字都需要重新检查这项算术。
  #
  # 注意共享预算*不*允许你做什么。这对全部四个分片同样成立——
  # 它们的 step 向量均为 3 / 5 / 8 / 3 / 10 / 5 / 5——所以只在此处声明，而
  # 不在任一 job 中声明：六个非 test step 已带有强制的 29m shared-convention
  # 预算，因此层级 A 的严格 job > step-sum 要求使 45m 成为
  # 该不变量留下的结构下限，而非对任一分片运行时的声明。实际会触发的预算
  # 在挂起的 run 上是 10m test step。若它接近 10m，应同时提高两项预算，而不是
  # 只提高 step 预算，否则严格不等式将不再保护证据 step。
  #
  # 由 scripts/tests/test-evidence.Tests.ps1 强制执行（由下方 Script Governance job 运行）。
  # 此规则的叙述性副本：docs/architecture/test-evidence-governance.md。
  #
  # ---------------------------------------------------------------------------------------------
  # 构建策略（MAN-669 PR-B / PR-C）。此主题与上述超时策略分开；两个 PR
  # 都未变更预算，因此这里的任何内容都不参与 Test-NervCiWorkflowBudgets 强制的算术。
  # 这里只保留结论——每项测量、run id、样本限制和重新开启条件仅位于唯一的
  # 位置：docs/architecture/backend-ci-build-strategy.md。不得在此复述数字：MAN-664
  # 将重新测量，而复制到四个文件中的数字会在其中三个文件中漂移。
  #
  #   * 每个分片继续只 restore 和 build 自己的 .slnf。build-once（一个串行 build job，
  #     向各分片提供预构建输出）已在四次 hosted-runner run 上测量，其中两次热缓存、
  #     两次冷缓存；在两种核算口径下均更慢——仅 whole-solution build 本身
  #     就比任何单个分片自身的 restore+build 成本更高，因此将它置于 critical path
  #     即使尚未在 job 间传输数 GB 输出，也得不偿失。把一个分片拆分为
  #     restore / build --no-restore / test 也更慢。
  #   * 对三个专业 job（erp-sales-order-demand-acceptance、connector-host-tests、
  #     openapi-client-drift）也按相同的重复问题做了清点，其 build
  #     命令均未改变：没有一个会 build 整个 solution，且三者都远低于 critical
  #     path，因此即使将它们的 build 时间降为零，也不会缩短 CI wall clock。
  #
  # 仅在该文档列出的可执行条件出现时重新开启任一决定（最慢
  # 分片的 build 接近 whole-solution build、runner 规格变化、出现一个数量级的
  # artifact-transfer 提升、总 test 时间再次大幅下降，或某个专业 job
  # 到达 critical path）——并应重新测量，而非靠推理。否则引用该文档。
  #
  # 还有一项定义无论如何都不得重新推导：“critical path”指最大的 job，其判定范围是
  # 该次 run，而不是最慢的分片。二者已不再相同——已有一个 frontend job
  # 超过最慢的分片——因此依据“最慢分片”估算任何内容都会低估
  # run 的 wall clock。
  impact-plan:
    name: CI Impact Plan
    # NERV-668 拆解③前两批让 Script Governance、OpenAPI Drift 与 Connector Host Tests 消费这些 outputs；
    # NERV-685 PR②同时让 frontend jobs 消费 workspace 选择，ERP 与 Backend 仍不消费。
    # 计划失败时三个直接条件 job 保守运行，frontend 聚合则失败关闭。
    # 层级 B：失败后没有 evidence step；job 的 15m 是快速失败界限，各 step
    # 预算只表达逐 step 上限。
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      scripts: ${{ steps.plan.outputs.scripts }}
      docs: ${{ steps.plan.outputs.docs }}
      connector_hosts: ${{ steps.plan.outputs.connector_hosts }}
      workflows: ${{ steps.plan.outputs.workflows }}
      infra: ${{ steps.plan.outputs.infra }}
      backend_contracts: ${{ steps.plan.outputs.backend_contracts }}
      backend_testing: ${{ steps.plan.outputs.backend_testing }}
      backend_persistence: ${{ steps.plan.outputs.backend_persistence }}
      backend_messaging: ${{ steps.plan.outputs.backend_messaging }}
      business_gateway: ${{ steps.plan.outputs.business_gateway }}
      openapi_codegen: ${{ steps.plan.outputs.openapi_codegen }}
      frontend_apps: ${{ steps.plan.outputs.frontend_apps }}
      frontend_packages: ${{ steps.plan.outputs.frontend_packages }}
      frontend_design_system: ${{ steps.plan.outputs.frontend_design_system }}
      frontend_docs: ${{ steps.plan.outputs.frontend_docs }}
      postgresql: ${{ steps.plan.outputs.postgresql }}
      redis_cap: ${{ steps.plan.outputs.redis_cap }}
      full_chain: ${{ steps.plan.outputs.full_chain }}
      business_services: ${{ steps.plan.outputs.business_services }}
      plan_path: ${{ steps.plan.outputs.plan_path }}
      frontend_selected: ${{ steps.frontend-plan.outputs.frontend_selected }}
      frontend_tests_selected: ${{ steps.frontend-plan.outputs.frontend_tests_selected }}
      frontend_test_matrix: ${{ steps.frontend-plan.outputs.frontend_test_matrix }}
      frontend_validation_matrix: ${{ steps.frontend-plan.outputs.frontend_validation_matrix }}
      frontend_plan_path: ${{ steps.frontend-plan.outputs.frontend_plan_path }}
      frontend_inventory_path: ${{ steps.frontend-plan.outputs.frontend_inventory_path }}
    steps:
      - name: Checkout full history for impact observation
        timeout-minutes: 3
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build observed impact plan
        id: plan
        timeout-minutes: 5
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DIFF_MODE: ${{ github.event_name == 'pull_request' && 'MergeBase' || 'Range' }}
        run: >-
          ./scripts/get-ci-impact-plan.ps1
          -BaseSha $env:BASE_SHA
          -HeadSha $env:HEAD_SHA
          -DiffMode $env:DIFF_MODE
          -OutputPath artifacts/ci-impact-plan/impact-plan.json

      - name: Build frontend workspace plan
        id: frontend-plan
        timeout-minutes: 5
        shell: pwsh
        env:
          FRONTEND_MODE: ${{ github.event_name == 'push' && 'Full' || 'Affected' }}
        run: >-
          ./scripts/get-frontend-workspace-plan.ps1
          -ImpactPlanPath artifacts/ci-impact-plan/impact-plan.json
          -Mode $env:FRONTEND_MODE

      - name: Upload CI impact plans
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: ci-impact-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ci-impact-plan/impact-plan.json
            artifacts/ci-impact-plan/frontend-workspace-plan.json
            artifacts/ci-impact-plan/frontend-test-inventory.json
          if-no-files-found: error
          retention-days: 14

  backend-tests:
    name: Backend Tests
    # 层级 B。纯聚合：对 needs 结果进行五次 `test` 比较，观测值为 ~2s。
    timeout-minutes: 5
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-test-shard-governance
      - backend-tests-business-gateway
      - backend-tests-platform
      - backend-tests-business-core-a
      - backend-tests-business-core-b
    steps:
      - name: Require all backend fast shards
        timeout-minutes: 3
        run: |
          test "${{ needs.backend-test-shard-governance.result }}" = "success"
          test "${{ needs.backend-tests-business-gateway.result }}" = "success"
          test "${{ needs.backend-tests-platform.result }}" = "success"
          test "${{ needs.backend-tests-business-core-a.result }}" = "success"
          test "${{ needs.backend-tests-business-core-b.result }}" = "success"

  backend-test-shard-governance:
    name: Backend Test Shard Governance
    # 层级 B（失败后没有 step 运行）。契约测试会多轮运行真实 validator 变异；
    # 15m job 预算仍是快速失败界限，step 预算合计为 21m 且仅为逐 step 上限。
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup Ruby for structured workflow validation
        timeout-minutes: 5
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      # 每个 step 只运行一个 script，不在一个 `run:` 块中串联：两个 script 都会在 stdout 报告发现的问题
      # 并以 1 退出；若串联，第二个 script 的 `$LASTEXITCODE` 会覆盖第一个的值，
      # 使真实失败变绿（已测量）。原因：
      # docs/architecture/backend-ci-build-strategy.md ("走查收尾" 第 3 条).
      - name: Validate backend test shard classification
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/verify-backend-test-shards.ps1

      - name: Test backend test shard governance
        timeout-minutes: 8
        shell: pwsh
        run: ./scripts/tests/backend-test-shards.Tests.ps1

  backend-tests-business-gateway:
    name: Backend Tests - BusinessGateway
    # 层级 A；共享分片预算为 39m < 45m，仅在超时策略中推导一次，该策略位于
    # `jobs:` 顶部。job 名称已冻结，因为 MAN-661 将证据 lane backend-shard-1 映射到它，映射定义在
    # scripts/lib/TestEvidence.ps1 中——该名称标识 lane，而非分片内容；这些内容
    # 仅存在于 scripts/backend-test-shards.json 中。
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        timeout-minutes: 8
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props', 'connector-hosts/**/*.csproj', 'connector-hosts/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve test evidence environment
        timeout-minutes: 3
        id: shard-evidence-environment
        shell: pwsh
        run: |
          $testedSha = (git rev-parse HEAD).Trim()
          "runner-image=$env:ImageOS@$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "dotnet-sdk=$(dotnet --version)" >> $env:GITHUB_OUTPUT
          "tested-sha=$testedSha" >> $env:GITHUB_OUTPUT
          Write-Host "tested-sha=$testedSha"

      - name: Test BusinessGateway shard
        timeout-minutes: 10
        id: shard-tests
        shell: pwsh
        run: >-
          ./scripts/run-backend-test-shard.ps1
          -ShardId business-gateway
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-1
          -TrxFilePrefix backend-tests-business-gateway

      - name: Collect BusinessGateway shard evidence
        timeout-minutes: 5
        id: collect-shard-evidence
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: >-
          ./scripts/collect-test-evidence.ps1
          -Lane backend-shard-1
          -SelectedLanes backend-shard-1
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-1
          -OutputDirectory artifacts/test-evidence/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-1
          -WorkflowRunId ${{ github.run_id }}
          -RunAttempt ${{ github.run_attempt }}
          -HeadSha ${{ github.event.pull_request.head.sha || github.sha }}
          -TestedSha ${{ steps.shard-evidence-environment.outputs.tested-sha }}
          -RunnerOs ${{ runner.os }}
          -Repository ${{ github.repository }}
          -JobName "Backend Tests - BusinessGateway"
          -CurrentTestOutcome ${{ steps.shard-tests.outcome }}
          -Event ${{ github.event_name }}
          -HeadBranch $env:HEAD_BRANCH
          -SourceUrl ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          -RunnerImage ${{ steps.shard-evidence-environment.outputs.runner-image }}
          -DotnetSdk ${{ steps.shard-evidence-environment.outputs.dotnet-sdk }}
          -ArtifactName test-evidence-backend-shard-1-${{ github.run_id }}-${{ github.run_attempt }}
          -RetentionDays 14
          -StepSummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Upload BusinessGateway shard evidence
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-backend-shard-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect-shard-evidence.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 14

  backend-tests-platform:
    name: Backend Tests - Platform
    # 层级 A；共享分片预算为 39m < 45m，仅在超时策略中推导一次，该策略位于
    # `jobs:` 顶部。job 名称已冻结：MAN-661 将证据 lane backend-shard-2 映射到它。
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        timeout-minutes: 8
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props', 'connector-hosts/**/*.csproj', 'connector-hosts/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve test evidence environment
        timeout-minutes: 3
        id: shard-evidence-environment
        shell: pwsh
        run: |
          $testedSha = (git rev-parse HEAD).Trim()
          "runner-image=$env:ImageOS@$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "dotnet-sdk=$(dotnet --version)" >> $env:GITHUB_OUTPUT
          "tested-sha=$testedSha" >> $env:GITHUB_OUTPUT
          Write-Host "tested-sha=$testedSha"

      - name: Test platform shard
        timeout-minutes: 10
        id: shard-tests
        shell: pwsh
        run: >-
          ./scripts/run-backend-test-shard.ps1
          -ShardId platform
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-2
          -TrxFilePrefix backend-tests-platform

      - name: Collect platform shard evidence
        timeout-minutes: 5
        id: collect-shard-evidence
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: >-
          ./scripts/collect-test-evidence.ps1
          -Lane backend-shard-2
          -SelectedLanes backend-shard-2
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-2
          -OutputDirectory artifacts/test-evidence/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-2
          -WorkflowRunId ${{ github.run_id }}
          -RunAttempt ${{ github.run_attempt }}
          -HeadSha ${{ github.event.pull_request.head.sha || github.sha }}
          -TestedSha ${{ steps.shard-evidence-environment.outputs.tested-sha }}
          -RunnerOs ${{ runner.os }}
          -Repository ${{ github.repository }}
          -JobName "Backend Tests - Platform"
          -CurrentTestOutcome ${{ steps.shard-tests.outcome }}
          -Event ${{ github.event_name }}
          -HeadBranch $env:HEAD_BRANCH
          -SourceUrl ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          -RunnerImage ${{ steps.shard-evidence-environment.outputs.runner-image }}
          -DotnetSdk ${{ steps.shard-evidence-environment.outputs.dotnet-sdk }}
