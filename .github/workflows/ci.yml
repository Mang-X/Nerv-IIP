name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Timeout policy (MAN-799, re-derived for the MAN-669 shard topology). Every job declares
  # `timeout-minutes` and every explicit step declares one. Beyond that there are two tiers, because
  # "protect the evidence" only applies where there is evidence to protect:
  #
  #   A) Jobs with `if: always()` evidence steps — the four backend shards, plus
  #      erp-sales-order-demand-acceptance and connector-host-tests:
  #          sum(step timeout-minutes) < job timeout-minutes.
  #      A job-level timeout cancels the *whole* job, `if: always()` steps included, and would take
  #      the MAN-661 test-evidence artifacts down with it; a step-level timeout fails only that
  #      step, so the job continues into `Collect …` / `Upload …`. The strict inequality is what
  #      guarantees some step budget fires first. It holds only if *every* explicit step has a
  #      budget, evidence collection/upload included. The remaining margin (job − sum) must also
  #      absorb GitHub's implicit `Set up job` and post steps, which are not in `steps:` and cannot
  #      carry `timeout-minutes`; the post steps run *after* Upload, so they can cost budget but
  #      never cost evidence. Adding a step here means adding its budget *and* raising the job
  #      budget. Every shard job below keeps a 6-minute margin for exactly that.
  #
  #   B) Jobs with no step that can run after a failure — the `Backend Tests` aggregate,
  #      backend-test-shard-governance, frontend, openapi-client-drift, script-governance: nothing
  #      is lost when the job budget fires, so the budget is *not* inflated to clear the step sum.
  #      Here the **job** budget is the fail-fast bound, sized from observed runtime. Step budgets
  #      are per-step upper bounds only: with several steps in one job the later ones are not
  #      individually reachable (`frontend` sums to 58m inside a 20m job, so its 15m build budget
  #      can never fire on its own), and that is accepted rather than claimed otherwise. The only
  #      thing enforced is the case that is dead under every schedule — a step budget at or above
  #      the whole job budget.
  #
  # Shard test-step budgets are ~2x the observed maximum for that shard, while short fixed-cost
  # steps (checkout, SDK setup, cache restore, evidence collect/upload) get a 3–8 minute floor that
  # no healthy run comes near.
  #
  # MAN-669 PR-A re-homed the shard contents (see scripts/backend-test-shards.json), so the four
  # shards no longer have four different shapes and no longer take four different budgets. The old
  # spread (8m / 10m / 15m / 12m) was sized from the pre-rebalance split where one shard carried
  # 357s of TRX elapsed and another 23s; that topology no longer exists, and a budget inherited
  # across a topology change describes nothing.
  #
  # Re-derived from run 31114441118 (this branch, all 11 jobs green), where the rebalanced shards
  # measured 129.8s / 150.6s / 164.5s / 112.9s of TRX elapsed and test steps of 3.5m / 3.0m / 4.2m
  # / 2.4m. All four therefore take the same 9m test-step budget — ~2x the 4.2m observed maximum —
  # the same 38m step sum and the same 44m job budget, keeping the 6m margin.
  #
  # Enforced by scripts/tests/test-evidence.Tests.ps1 (run by the Script Governance job below).
  # Narrative copy of this rule: docs/architecture/test-evidence-governance.md.
  backend-tests:
    name: Backend Tests
    # Tier B. Pure aggregate: five `test` comparisons over needs results, ~2s observed.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-test-shard-governance
      - backend-tests-business-gateway
      - backend-tests-platform
      - backend-tests-business-core-a
      - backend-tests-business-core-b
    steps:
      - name: Require all backend fast shards
        timeout-minutes: 3
        run: |
          test "${{ needs.backend-test-shard-governance.result }}" = "success"
          test "${{ needs.backend-tests-business-gateway.result }}" = "success"
          test "${{ needs.backend-tests-platform.result }}" = "success"
          test "${{ needs.backend-tests-business-core-a.result }}" = "success"
          test "${{ needs.backend-tests-business-core-b.result }}" = "success"

  backend-test-shard-governance:
    name: Backend Test Shard Governance
    # Tier B (no step runs after a failure). Read-only manifest + structured `ci.yml` validation,
    # observed max 0.8m. The 15m job budget is the fail-fast bound; step budgets sum to 18m and
    # are per-step upper bounds only.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup Ruby for structured workflow validation
        timeout-minutes: 5
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Validate backend test shard classification
        timeout-minutes: 10
        shell: pwsh
        run: |
          ./scripts/verify-backend-test-shards.ps1
          ./scripts/tests/backend-test-shards.Tests.ps1

  backend-tests-business-gateway:
    name: Backend Tests - BusinessGateway
    # Tier A (evidence steps). The job name is frozen (MAN-661 maps evidence lane backend-shard-1 to
    # it in scripts/lib/TestEvidence.ps1); after MAN-669 PR-A the shard is no longer
    # BusinessGateway-only — MAN-663 cut that assembly from 869s to 23s, so the shard now also
    # carries ERP, MasterData, WMS, Maintenance and Scheduling. Measured on run 31114441118: 129.8s
    # of TRX elapsed over 2550 tests, 3.5m test step, 4.0m job. Budget: 9m test step, step budgets
    # sum to 38m, leaving 6m of margin for the implicit setup/post steps.
    #
    # The job budget cannot usefully go below that sum: tier A requires job > sum, and the six
    # non-test steps already carry a mandatory 29m of shared-convention budget. So 9m — the budget
    # that actually fires on a hung run — is the real fail-fast bound here; 44m is the structural
    # floor the invariant leaves behind, not a claim about this job's runtime. If the test step ever
    # approaches 9m, raise both budgets rather than only the step one, or the strict inequality
    # stops protecting the evidence steps.
    timeout-minutes: 44
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        timeout-minutes: 8
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props', 'connector-hosts/**/*.csproj', 'connector-hosts/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve test evidence environment
        timeout-minutes: 3
        id: shard-evidence-environment
        shell: pwsh
        run: |
          $testedSha = (git rev-parse HEAD).Trim()
          "runner-image=$env:ImageOS@$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "dotnet-sdk=$(dotnet --version)" >> $env:GITHUB_OUTPUT
          "tested-sha=$testedSha" >> $env:GITHUB_OUTPUT
          Write-Host "tested-sha=$testedSha"

      - name: Test BusinessGateway shard
        timeout-minutes: 9
        id: shard-tests
        shell: pwsh
        run: >-
          ./scripts/run-backend-test-shard.ps1
          -ShardId business-gateway
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-1
          -TrxFilePrefix backend-tests-business-gateway

      - name: Collect BusinessGateway shard evidence
        timeout-minutes: 5
        id: collect-shard-evidence
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: >-
          ./scripts/collect-test-evidence.ps1
          -Lane backend-shard-1
          -SelectedLanes backend-shard-1
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-1
          -OutputDirectory artifacts/test-evidence/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-1
          -WorkflowRunId ${{ github.run_id }}
          -RunAttempt ${{ github.run_attempt }}
          -HeadSha ${{ github.event.pull_request.head.sha || github.sha }}
          -TestedSha ${{ steps.shard-evidence-environment.outputs.tested-sha }}
          -RunnerOs ${{ runner.os }}
          -Repository ${{ github.repository }}
          -JobName "Backend Tests - BusinessGateway"
          -CurrentTestOutcome ${{ steps.shard-tests.outcome }}
          -Event ${{ github.event_name }}
          -HeadBranch $env:HEAD_BRANCH
          -SourceUrl ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          -RunnerImage ${{ steps.shard-evidence-environment.outputs.runner-image }}
          -DotnetSdk ${{ steps.shard-evidence-environment.outputs.dotnet-sdk }}
          -ArtifactName test-evidence-backend-shard-1-${{ github.run_id }}-${{ github.run_attempt }}
          -RetentionDays 14
          -StepSummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Upload BusinessGateway shard evidence
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-backend-shard-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect-shard-evidence.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 14

  backend-tests-platform:
    name: Backend Tests - Platform
    # Tier A (evidence steps). The only shard MAN-669 PR-A left untouched: its 169.2s of TRX elapsed
    # on run 30999368607 already sat at the rebalance target, so its project list carries over
    # unchanged. Measured on run 31114441118: 150.6s of TRX elapsed, 3.0m test step, 3.7m job. It
    # takes the same 9m/38m/44m budgets as the other three so one measurement governs all four.
    timeout-minutes: 44
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
