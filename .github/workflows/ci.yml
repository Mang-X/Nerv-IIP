  # 该不变量留下的结构下限，而非对任一分片运行时的声明。实际会触发的预算
  # 在挂起的 run 上是 10m test step。若它接近 10m，应同时提高两项预算，而不是
  # 只提高 step 预算，否则严格不等式将不再保护证据 step。
  #
  # 由 scripts/tests/test-evidence.Tests.ps1 强制执行（由下方 Script Governance job 运行）。
  # 当前证据治理：docs/governance/testing/evidence.md。
  #
  # ---------------------------------------------------------------------------------------------
  # 构建策略（MAN-669 PR-B / PR-C）。此主题与上述超时策略分开；两个 PR
  # 都未变更预算，因此这里的任何内容都不参与 Test-NervCiWorkflowBudgets 强制的算术。
  # 这里只保留结论——每项测量、run id、样本限制和重新开启条件仅位于唯一的
  # 位置：docs/reports/audits/backend-ci-build-strategy-man-669.md。不得在此复述数字：MAN-664
  # 将重新测量，而复制到四个文件中的数字会在其中三个文件中漂移。
  #
  #   * 每个分片继续只 restore 和 build 自己的 .slnf。build-once（一个串行 build job，
  #     向各分片提供预构建输出）已在四次 hosted-runner run 上测量，其中两次热缓存、
  #     两次冷缓存；在两种核算口径下均更慢——仅 whole-solution build 本身
          ruby-version: '3.4'

      # 每个 step 只运行一个 script，不在一个 `run:` 块中串联：两个 script 都会在 stdout 报告发现的问题
      # 并以 1 退出；若串联，第二个 script 的 `$LASTEXITCODE` 会覆盖第一个的值，
      # 使真实失败变绿（已测量）。原因：
      # docs/reports/audits/backend-ci-build-strategy-man-669.md ("走查收尾" 第 3 条).
      - name: Validate backend test shard classification
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/verify-backend-test-shards.ps1
        run: ./scripts/verify-openapi-client-drift.ps1

  script-governance:
    name: Script Governance
    # 层级 B（失败后没有 step 运行）。job 预算是按观测运行时间设定的快速失败上限
    # （docs/governance/testing/evidence.md 的 CI timeout 规则）。
    #
    # 20m 的来源（#2700，2026-08-28 实测）：样本为 main 上 08-22 至 08-28 的 50 次 run
    # （最近 25 次连续，更早区间每 4 次取 1）。整个 job 的观测区间是 6.63m–10.05m；
    # 在最近 25 次连续采样中，19 次落在 9m 以上，中位数约 9.6m。
      # decision still. #1509 narrowed the exclusion list to three entries and put scripts/lib under
      # a declared library scope, and a boundary nobody re-checks drifts back — so the exclusion list
      # and the library rule set are asserted here, in CI, not only in the local gate. Deliberately
      # split out of scripts/tests/check-script-governance.Tests.ps1, which also drives the
      # ScriptAutomation stream-drain and detached-process fixtures; this file is 4.7s of checker
      # runs against small fixtures. Ruling: docs/governance/script-automation.md.
      - name: Test script governance scan boundary
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/script-governance-scan-boundary.Tests.ps1
