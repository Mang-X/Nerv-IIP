    # moved Quality, Maintenance, Scheduling and the acceptance suite out, adding DemandPlanning and
    # ProductEngineering. It is deliberately given the lowest TRX share of the four because it
    # measured the worst step-to-TRX ratio before the rebalance (265s step for 191.7s TRX on run
    # 30999368607). Measured on run 31114441118: 112.9s of TRX elapsed, 2.4m test step, 2.8m job,
