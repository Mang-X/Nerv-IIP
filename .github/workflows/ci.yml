name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Timeout policy (MAN-799): every job carries an outer `timeout-minutes` so a hang can never
  # burn the 360-minute GitHub default. The steps that actually hang (test/verify runs) carry a
  # *smaller* step-level budget, because a job-level timeout cancels the whole job — including
  # `if: always()` steps — and would take the MAN-661 test-evidence artifacts down with it. With a
  # step-level budget the step fails, the job keeps going, and the evidence is still collected and
  # uploaded. Budgets are ~2x (step) / ~2.5x (job) the observed maximum over the last 9 runs.
  backend-tests:
    name: Backend Tests
    # Observed max 23.9m / avg 17.9m.
    timeout-minutes: 55
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props', 'connector-hosts/**/*.csproj', 'connector-hosts/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve test evidence environment
        id: backend-evidence-environment
        shell: pwsh
        run: |
          $testedSha = (git rev-parse HEAD).Trim()
          "runner-image=$env:ImageOS@$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "dotnet-sdk=$(dotnet --version)" >> $env:GITHUB_OUTPUT
          "tested-sha=$testedSha" >> $env:GITHUB_OUTPUT
          Write-Host "tested-sha=$testedSha"

      - name: Test backend solution
        id: backend-tests
        # Smaller than the job budget so the evidence steps below still run on a hang.
        timeout-minutes: 40
        run: >-
          dotnet test backend/Nerv.IIP.sln
          --configuration Release
          --logger trx
          --results-directory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend

      - name: Collect backend test evidence
        id: collect-backend-evidence
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: >-
          ./scripts/collect-test-evidence.ps1
          -Lane backend
          -SelectedLanes backend
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend
          -OutputDirectory artifacts/test-evidence/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend
          -WorkflowRunId ${{ github.run_id }}
          -RunAttempt ${{ github.run_attempt }}
          -HeadSha ${{ github.event.pull_request.head.sha || github.sha }}
          -TestedSha ${{ steps.backend-evidence-environment.outputs.tested-sha }}
          -RunnerOs ${{ runner.os }}
          -Repository ${{ github.repository }}
          -JobName "Backend Tests"
          -CurrentTestOutcome ${{ steps.backend-tests.outcome }}
          -Event ${{ github.event_name }}
          -HeadBranch $env:HEAD_BRANCH
          -SourceUrl ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          -RunnerImage ${{ steps.backend-evidence-environment.outputs.runner-image }}
          -DotnetSdk ${{ steps.backend-evidence-environment.outputs.dotnet-sdk }}
          -ArtifactName test-evidence-backend-${{ github.run_id }}-${{ github.run_attempt }}
          -RetentionDays 14
          -StepSummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect-backend-evidence.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 14

  erp-sales-order-demand-acceptance:
    name: ERP Sales Order Demand Acceptance
    # Observed max 4.2m / avg 3.9m; extra headroom for Docker image pulls.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      NERV_IIP_TEST_POSTGRES: Host=127.0.0.1;Port=15432;Database=nerv_iip;Username=nerv;Password=nerv
      NERV_IIP_TEST_REDIS: 127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Prepare PostgreSQL and Redis images
        timeout-minutes: 10
        run: |
          docker pull postgres:18
          docker pull redis:8

      - name: Verify ERP sales-order demand bridge
        shell: pwsh
        # Smaller than the job budget so the diagnostics upload below still runs on a hang.
        timeout-minutes: 15
        run: ./scripts/verify-erp-sales-order-demand-planning.ps1

      - name: Upload ERP sales-order demand diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erp-sales-order-demand-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/acceptance/man517
            artifacts/script-logs/man517-*
          if-no-files-found: warn
          retention-days: 7

  connector-host-tests:
    name: Connector Host Tests
    # Observed max 1.9m / avg 1.6m. This is the job that hung for 28m in MAN-799.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props', 'connector-hosts/**/*.csproj', 'connector-hosts/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve test evidence environment
        id: connector-evidence-environment
        shell: pwsh
        run: |
          $testedSha = (git rev-parse HEAD).Trim()
          "runner-image=$env:ImageOS@$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "dotnet-sdk=$(dotnet --version)" >> $env:GITHUB_OUTPUT
          "tested-sha=$testedSha" >> $env:GITHUB_OUTPUT
          Write-Host "tested-sha=$testedSha"

      - name: Test connector host solution
        id: connector-host-tests
        # Smaller than the job budget so the evidence steps below still run on a hang.
        timeout-minutes: 12
        run: >-
          dotnet test connector-hosts/Nerv.IIP.ConnectorHost.sln
          --configuration Release
          --logger trx
          --results-directory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/connector-host

      - name: Collect connector host test evidence
        id: collect-connector-host-evidence
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: >-
          ./scripts/collect-test-evidence.ps1
          -Lane connector-host
          -SelectedLanes connector-host
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/connector-host
          -OutputDirectory artifacts/test-evidence/${{ github.run_id }}/attempt-${{ github.run_attempt }}/connector-host
          -WorkflowRunId ${{ github.run_id }}
          -RunAttempt ${{ github.run_attempt }}
          -HeadSha ${{ github.event.pull_request.head.sha || github.sha }}
          -TestedSha ${{ steps.connector-evidence-environment.outputs.tested-sha }}
          -RunnerOs ${{ runner.os }}
          -Repository ${{ github.repository }}
          -JobName "Connector Host Tests"
          -CurrentTestOutcome ${{ steps.connector-host-tests.outcome }}
          -Event ${{ github.event_name }}
          -HeadBranch $env:HEAD_BRANCH
          -SourceUrl ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          -RunnerImage ${{ steps.connector-evidence-environment.outputs.runner-image }}
          -DotnetSdk ${{ steps.connector-evidence-environment.outputs.dotnet-sdk }}
          -ArtifactName test-evidence-connector-host-${{ github.run_id }}-${{ github.run_attempt }}
          -RetentionDays 14
          -StepSummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Upload connector host test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-connector-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect-connector-host-evidence.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend Typecheck and Build
    # Observed max 5.0m / avg 4.4m.
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        timeout-minutes: 12
        run: pnpm -C frontend install --frozen-lockfile

      - name: Check frontend format and lint
        timeout-minutes: 10
        run: pnpm -C frontend check

      - name: Typecheck frontend
        timeout-minutes: 10
        run: pnpm -C frontend typecheck

      - name: Build frontend
        timeout-minutes: 15
        run: pnpm -C frontend build

  openapi-client-drift:
    name: OpenAPI/api-client Drift
    # Observed max 2.2m / avg 1.9m.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Verify OpenAPI/api-client drift
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/verify-openapi-client-drift.ps1

  script-governance:
    name: Script Governance
    # Observed max 1.8m / avg 0.7m.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run script governance check
        shell: pwsh
        run: ./scripts/check-script-governance.ps1

      - name: Test backend determinism checker
        shell: pwsh
        run: ./scripts/tests/check-backend-test-determinism.Tests.ps1

      - name: Test backend determinism verifier
        shell: pwsh
        run: ./scripts/tests/verify-backend-test-determinism.Tests.ps1

      - name: Run backend determinism checker
        shell: pwsh
        run: ./scripts/check-backend-test-determinism.ps1

      - name: Run test evidence contract tests
        shell: pwsh
        run: ./scripts/tests/test-evidence.Tests.ps1
