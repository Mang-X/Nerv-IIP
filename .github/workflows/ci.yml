  backend-tests-business-core-b:
    name: Backend Tests - Business Core B
    # Tier A (evidence steps). Observed max 4.8m. Step budgets sum to 41m, leaving 6m of margin
    # for the implicit setup/post steps.
    timeout-minutes: 47
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        timeout-minutes: 8
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props', 'connector-hosts/**/*.csproj', 'connector-hosts/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve test evidence environment
        timeout-minutes: 3
        id: shard-evidence-environment
        shell: pwsh
        run: |
          $testedSha = (git rev-parse HEAD).Trim()
          "runner-image=$env:ImageOS@$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "dotnet-sdk=$(dotnet --version)" >> $env:GITHUB_OUTPUT
          "tested-sha=$testedSha" >> $env:GITHUB_OUTPUT
          Write-Host "tested-sha=$testedSha"

      - name: Test business core B shard
        timeout-minutes: 12
        id: shard-tests
        shell: pwsh
        run: >-
          ./scripts/run-backend-test-shard.ps1
          -ShardId business-core-b
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-4
          -TrxFilePrefix backend-tests-business-core-b

