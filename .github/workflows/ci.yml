  backend-tests-business-core-b:
    name: Backend Tests - Business Core B
    # 层级 A；共享分片预算为 39m < 45m，仅在 `jobs:` 顶部的超时策略中推导一次。job 名称已冻结：MAN-661
    # 将证据 lane backend-shard-4 映射到它。MAN-669 PR-A 为此分片赋予最低 TRX 份额；该权重依赖于
    # 重平衡前的 step-to-TRX 比率，已被重平衡本身证伪——参见 `jobs:` 顶部的超时策略。
    # 当前权重不得脱离顶部记录的测量证据单独解释。
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        timeout-minutes: 8
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props', 'connector-hosts/**/*.csproj', 'connector-hosts/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve test evidence environment
        timeout-minutes: 3
        id: shard-evidence-environment
        shell: pwsh
        run: |
          $testedSha = (git rev-parse HEAD).Trim()
          "runner-image=$env:ImageOS@$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "dotnet-sdk=$(dotnet --version)" >> $env:GITHUB_OUTPUT
          "tested-sha=$testedSha" >> $env:GITHUB_OUTPUT
          Write-Host "tested-sha=$testedSha"

      - name: Test business core B shard
        timeout-minutes: 10
        id: shard-tests
        shell: pwsh
        run: >-
          ./scripts/run-backend-test-shard.ps1
          -ShardId business-core-b
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-4
          -TrxFilePrefix backend-tests-business-core-b

      - name: Collect business core B shard evidence
        timeout-minutes: 5
        id: collect-shard-evidence
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: >-
          ./scripts/collect-test-evidence.ps1
          -Lane backend-shard-4
          -SelectedLanes backend-shard-4
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-4
          -OutputDirectory artifacts/test-evidence/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-4
          -WorkflowRunId ${{ github.run_id }}
          -RunAttempt ${{ github.run_attempt }}
          -HeadSha ${{ github.event.pull_request.head.sha || github.sha }}
          -TestedSha ${{ steps.shard-evidence-environment.outputs.tested-sha }}
          -RunnerOs ${{ runner.os }}
          -Repository ${{ github.repository }}
          -JobName "Backend Tests - Business Core B"
          -CurrentTestOutcome ${{ steps.shard-tests.outcome }}
          -Event ${{ github.event_name }}
          -HeadBranch $env:HEAD_BRANCH
          -SourceUrl ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          -RunnerImage ${{ steps.shard-evidence-environment.outputs.runner-image }}
          -DotnetSdk ${{ steps.shard-evidence-environment.outputs.dotnet-sdk }}
          -ArtifactName test-evidence-backend-shard-4-${{ github.run_id }}-${{ github.run_attempt }}
          -RetentionDays 14
          -StepSummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Upload business core B shard evidence
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-backend-shard-4-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect-shard-evidence.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 14

  erp-sales-order-demand-acceptance:
    name: ERP Sales Order Demand Acceptance
    # 层级 A（证据 step）。观测最大值为 4.2m / 平均值为 3.9m；为 Docker image pull 预留额外余量。
    # step 预算合计为 46m，为隐式 setup/post step 留下 9m 余量。
    timeout-minutes: 55
    runs-on: ubuntu-latest
    env:
      NERV_IIP_TEST_POSTGRES: Host=127.0.0.1;Port=15432;Database=nerv_iip;Username=nerv;Password=nerv
      NERV_IIP_TEST_REDIS: 127.0.0.1:6379
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        timeout-minutes: 8
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Prepare PostgreSQL and Redis images
        timeout-minutes: 10
        run: |
          docker pull postgres:18
          docker pull redis:8

      - name: Verify ERP sales-order demand bridge
        timeout-minutes: 15
        shell: pwsh
        run: ./scripts/verify-erp-sales-order-demand-planning.ps1

      - name: Upload ERP sales-order demand diagnostics
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erp-sales-order-demand-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/acceptance/man517
            artifacts/script-logs/man517-*
          if-no-files-found: warn
          retention-days: 7

  connector-host-tests:
    name: Connector Host Tests
    # 层级 A（证据 step）。观测最大值为 1.9m / 平均值为 1.6m。这是 MAN-799 中挂起 28m 的 job。
    # step 预算合计为 41m，为隐式 setup/post step 留下 9m 余量。
    timeout-minutes: 50
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        timeout-minutes: 8
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props', 'connector-hosts/**/*.csproj', 'connector-hosts/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve test evidence environment
