  frontend-unit-test-shards:
    name: Frontend Unit Test (${{ matrix.name }})
    needs: impact-plan
    if: needs.impact-plan.outputs.frontend_tests_selected == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.impact-plan.outputs.frontend_test_matrix) }}
    # 层级 A。每个受影响 workspace 独立产出 JUnit/JSON；测试失败后仍上传该 shard
    # 已生成的证据。3 + 3 + 5 + 12 + 20 + 5 = 48m < 55m。
    timeout-minutes: 55
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        timeout-minutes: 12
        run: pnpm -C frontend install --frozen-lockfile

      - name: Test affected frontend workspace
        timeout-minutes: 20
        run: >-
          pnpm -C frontend --filter "${{ matrix.name }}" test
          --reporter=default
          --reporter=junit
          --reporter=json
          --outputFile.junit=artifacts/test-results/junit.xml
          --outputFile.json=artifacts/test-results/results.json
          --slowTestThreshold=1000

      - name: Upload frontend unit test shard evidence
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-test-evidence-${{ matrix.slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/apps/*/artifacts/test-results/*.xml
            frontend/apps/*/artifacts/test-results/*.json
            frontend/packages/*/artifacts/test-results/*.xml
            frontend/packages/*/artifacts/test-results/*.json
          if-no-files-found: error
          retention-days: 14

  frontend-unit-tests:
    name: Frontend Unit Tests
    if: always()
    needs:
      - impact-plan
      - frontend-unit-test-shards
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate frontend unit test shards
        timeout-minutes: 3
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMPACT_RESULT: ${{ needs.impact-plan.result }}
          FRONTEND_TESTS_SELECTED: ${{ needs.impact-plan.outputs.frontend_tests_selected }}
          SHARD_RESULT: ${{ needs.frontend-unit-test-shards.result }}
        run: |
          test "$IMPACT_RESULT" = "success"
          if test "$FRONTEND_TESTS_SELECTED" = "true"; then
            test "$SHARD_RESULT" = "success"
          else
            test "$FRONTEND_TESTS_SELECTED" = "false"
            test "$SHARD_RESULT" = "skipped"
          fi

  frontend-check:
    name: Frontend Check (Affected)
    needs: impact-plan
    if: needs.impact-plan.outputs.frontend_selected == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        timeout-minutes: 12
        run: pnpm -C frontend install --frozen-lockfile

      - name: Check frontend format and lint
        timeout-minutes: 10
        run: pnpm -C frontend check

  frontend-validation-shards:
    name: Frontend Validation (${{ matrix.name }})
    needs: impact-plan
    if: needs.impact-plan.outputs.frontend_selected == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.impact-plan.outputs.frontend_validation_matrix) }}
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        timeout-minutes: 12
        run: pnpm -C frontend install --frozen-lockfile

      - name: Typecheck affected frontend workspace
        if: matrix.run_typecheck
        timeout-minutes: 10
        run: pnpm -C frontend --filter "${{ matrix.name }}" typecheck

      - name: Build affected frontend app
        if: matrix.run_build
        timeout-minutes: 20
        run: pnpm -C frontend --filter "${{ matrix.name }}" build

  frontend:
    name: Frontend Typecheck and Build
    if: always()
    needs:
      - impact-plan
      - frontend-check
      - frontend-validation-shards
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate frontend validation shards
        timeout-minutes: 3
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMPACT_RESULT: ${{ needs.impact-plan.result }}
          FRONTEND_SELECTED: ${{ needs.impact-plan.outputs.frontend_selected }}
          CHECK_RESULT: ${{ needs.frontend-check.result }}
          VALIDATION_RESULT: ${{ needs.frontend-validation-shards.result }}
        run: |
          test "$IMPACT_RESULT" = "success"
          if test "$FRONTEND_SELECTED" = "true"; then
            test "$CHECK_RESULT" = "success"
            test "$VALIDATION_RESULT" = "success"
          else
            test "$FRONTEND_SELECTED" = "false"
            test "$CHECK_RESULT" = "skipped"
            test "$VALIDATION_RESULT" = "skipped"
          fi

  openapi-client-drift:
    name: OpenAPI/api-client Drift
    # 层级 B（失败后没有 step 运行）。观测最大值为 2.0m / 平均值为 1.8m；20m job 预算是
    # 快速失败界限。step 预算合计为 39m，且仅为逐 step 上限。
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: impact-plan
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' || needs.impact-plan.result != 'success' || needs.impact-plan.outputs.openapi_codegen != 'false') }}
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        timeout-minutes: 8
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Verify OpenAPI/api-client drift
        timeout-minutes: 15
        shell: pwsh
        run: ./scripts/verify-openapi-client-drift.ps1

  script-governance:
    name: Script Governance
    # 层级 B（失败后没有 step 运行）。已包含证据契约测试 step 的 run 中，观测最大值为 1.9m、平均值为 1.8m；
    # 本注释曾引用的 0.7m 平均值早于该证据契约测试 step。
    # 10m job 预算是快速失败界限；step 预算合计为 93m（19 个 step：3m
    # checkout + 18 × 5m），且仅为逐 step 上限。合计超过 job 预算
    # 对层级 B 是正确的，也不是 scripts/lib/CiWorkflowBudgets.ps1 执行的约束：
    # “step 预算合计低于 job 预算”不变量只适用于层级 A，即会从
    # `if: always()` step 发布证据、而该 step 会被 job 级超时取消的 job。本 job 没有
    # 此类 step，因此门禁从不读取这个数字——新增 step 时须人工保持其准确。
    # MAN-669 PR-C 添加了两个 solution-configuration-membership step；两者
    # 在本地均于 5s 内完成（checker 为 0.8s，其 contract test 为 3.6s），因此 job 预算保持不变。
    # #1509 添加了扫描边界契约 step（本地 5.2s）；基于同一理由，job 预算保持不变，
    # step 预算合计由 43m 调整为 48m。#1512 保留 ordinal-string 的内存对象边界合同，
    # 并增加独立的 ordinal comparison layers 合同；二者各有 5m step，合计为 58m。
    # 本 job 没有 `if: always()` 证据步骤，故仍属于层级 B，job 预算保持不变。
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: impact-plan
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' || needs.impact-plan.result != 'success' || needs.impact-plan.outputs.scripts != 'false' || needs.impact-plan.outputs.backend != 'false') }}
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run script governance check
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/check-script-governance.ps1

      - name: Verify CI required summary
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/verify-ci-required-summary.ps1

      - name: Test CI required summary
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/ci-required-summary.Tests.ps1

      - name: Test CI impact plan
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/ci-impact-plan.Tests.ps1

      - name: Test PostgreSQL lane contract
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/postgres-test-lane.Tests.ps1

      - name: Test frontend workspace plan
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/frontend-workspace-plan.Tests.ps1

      - name: Test nightly business performance workflow
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/nightly-business-performance-workflow.Tests.ps1

      - name: Test business performance metric completeness
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/business-performance-metrics-completeness.Tests.ps1

      - name: Test ordinal string primitives
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/ordinal-string.Tests.ps1

      # The checker above only reports on the files it decides to scan; this step is what holds that
      # decision still. #1509 narrowed the exclusion list to three entries and put scripts/lib under
      # a declared library scope, and a boundary nobody re-checks drifts back — so the exclusion list
      # and the library rule set are asserted here, in CI, not only in the local gate. Deliberately
      # split out of scripts/tests/check-script-governance.Tests.ps1, which also drives the
      # ScriptAutomation stream-drain and detached-process fixtures; this file is 4.7s of checker
      # runs against small fixtures. Ruling: docs/architecture/script-automation-governance.md.
      - name: Test script governance scan boundary
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/script-governance-scan-boundary.Tests.ps1

      - name: Test ordinal comparison layers
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/ordinal-comparison-layers.Tests.ps1

      - name: Test backend determinism checker
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/check-backend-test-determinism.Tests.ps1

      - name: Test backend determinism verifier
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/verify-backend-test-determinism.Tests.ps1

      - name: Run backend determinism checker
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/check-backend-test-determinism.ps1

      - name: Run test evidence contract tests
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/test-evidence.Tests.ps1

      - name: Test solution configuration membership checker
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/solution-configuration-membership.Tests.ps1

      - name: Run solution configuration membership check
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/verify-solution-configuration-membership.ps1

  ci-summary:
    name: CI Summary
    timeout-minutes: 5
    runs-on: ubuntu-latest
    if: always()
    needs:
      - impact-plan
      - backend-tests
      - postgres-provider-tests
      - connector-host-tests
      - frontend-unit-tests
      - frontend
      - openapi-client-drift
      - script-governance
    steps:
      - name: Require all CI lanes
        timeout-minutes: 3
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          impact_result="${{ needs.impact-plan.result }}"
          connector_result="${{ needs.connector-host-tests.result }}"
          script_governance_result="${{ needs.script-governance.result }}"
          openapi_result="${{ needs.openapi-client-drift.result }}"
          postgres_result="${{ needs.postgres-provider-tests.result }}"
          connector_selected="${{ github.event_name != 'pull_request' || needs.impact-plan.result != 'success' || needs.impact-plan.outputs.connector_hosts != 'false' }}"
          script_governance_selected="${{ github.event_name != 'pull_request' || needs.impact-plan.result != 'success' || needs.impact-plan.outputs.scripts != 'false' || needs.impact-plan.outputs.backend != 'false' }}"
          openapi_selected="${{ github.event_name != 'pull_request' || needs.impact-plan.result != 'success' || needs.impact-plan.outputs.openapi_codegen != 'false' }}"
          postgres_selected="${{ github.event_name != 'pull_request' || needs.impact-plan.result != 'success' || needs.impact-plan.outputs.postgresql != 'false' }}"

          if [[ "$connector_selected" = "true" ]]; then
            connector_policy="selected"
          else
            connector_policy="skipped by design"
          fi
          if [[ "$script_governance_selected" = "true" ]]; then
            script_governance_policy="selected"
          else
            script_governance_policy="skipped by design"
          fi
          if [[ "$openapi_selected" = "true" ]]; then
            openapi_policy="selected"
          else
            openapi_policy="skipped by design"
          fi
          if [[ "$postgres_selected" = "true" ]]; then
            postgres_policy="selected"
          else
            postgres_policy="skipped by policy"
          fi

          {
            echo "## CI lane decisions"
            echo
            echo "| Lane | Policy | Result |"
            echo "| --- | --- | --- |"
            echo "| Connector Host Tests | $connector_policy | $connector_result |"
            echo "| Script Governance | $script_governance_policy | $script_governance_result |"
            echo "| OpenAPI/api-client Drift | $openapi_policy | $openapi_result |"
            echo "| PostgreSQL Provider Tests | $postgres_policy | $postgres_result |"
          } >> "$GITHUB_STEP_SUMMARY"

          test "$impact_result" = "success"
          test "${{ needs.backend-tests.result }}" = "success"
          test "${{ needs.frontend-unit-tests.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
          if [[ "$connector_selected" = "true" ]]; then
            test "$connector_result" = "success"
          else
            test "$connector_result" = "skipped"
          fi
          if [[ "$postgres_selected" = "true" ]]; then
            test "$postgres_result" = "success"
          else
            test "$postgres_result" = "skipped"
          fi
          if [[ "$script_governance_selected" = "true" ]]; then
            test "$script_governance_result" = "success"
          else
            test "$script_governance_result" = "skipped"
          fi
          if [[ "$openapi_selected" = "true" ]]; then
            test "$openapi_result" = "success"
          else
            test "$openapi_result" = "skipped"
          fi
