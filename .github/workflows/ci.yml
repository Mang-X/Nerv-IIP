  postgres-provider-tests:
    name: PostgreSQL Provider Tests
    # NERV-688 拆解③第八批（收尾）：Inventory + MasterData + Scheduling + AppHub + BarcodeLabel
    # + FileStorage + IndustrialTelemetry + Quality + MES + WMS + ERP + DemandPlanning
    # + 跨业务 Acceptance + Maintenance。层级 A；显式 step 预算合计 90m，
    # 小于 101m job 预算，为 service setup 和 action post steps 保留 11m。
    # NERV-1854：原 5m 的 apt 安装步骤换成 1m 的零网络 psql 断言，step 预算合计由 94m 降到 90m。
    timeout-minutes: 101
    runs-on: ubuntu-latest
    needs: impact-plan
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' || needs.impact-plan.result != 'success' || needs.impact-plan.outputs.postgresql != 'false') }}
    env:
      NERV_IIP_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=nerv;Password=nerv
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nerv
          POSTGRES_PASSWORD: nerv
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nerv -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        timeout-minutes: 8
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Verify PostgreSQL client
        timeout-minutes: 1
        shell: bash
        run: |
          # NERV-1854：本步骤原先是 `apt-get install postgresql-client`，是本仓库当前 CI 最主要的
          # 失败源（2026-08-19 一天之内 main 与多个 PR 各红一次）。根因不是「apt 偶发慢」而是确定性
          # 挂死：ubuntu-latest 的 /etc/apt/apt-mirrors.txt 把 http://azure.archive.ubuntu.com 排在
          # priority:1，该主机不可达时每个索引都要先耗满连接超时再回落到 archive.ubuntu.com，这段
          # 耗时对每次尝试都要重复支付，因此「单次尝试超时 + 有限重试」在这个故障形态下必然三连败。
          # 真正的解法是不要 apt：run 32234996271 的成功日志显示该次 install 只有「1 newly installed
          # / Setting up postgresql-client (16+257build1.1)」——装进去的只是那个不含任何文件的元包，
          # 它依赖的 postgresql-client-16 早已随 runner 镜像预装的 PostgreSQL 16 一并存在，也就是
          # /usr/bin/psql 在本步骤之前就已经可用。删掉这次安装后 psql 的来源、版本与之前完全一致。
          # 保留一个零网络的可用性断言：镜像哪天真的不再预装 psql，本步骤会在 1 秒内大声失败并指名
          # 修复方向，而不是让下游 lane 以「命令找不到」的形态间接失败。
          if ! command -v psql >/dev/null 2>&1; then
            echo "::error::runner 镜像未预装 psql，PostgreSQL lane 无法运行。请在本步骤改回受控的 apt 安装（并按 NERV-1854 摘掉 azure 镜像），不要放任下游 lane 以「命令找不到」失败。" >&2
            exit 1
          fi
          psql --version

      - name: Resolve PostgreSQL evidence environment
        timeout-minutes: 3
        id: postgres-evidence-environment
        shell: pwsh
        run: |
          $testedSha = (git rev-parse HEAD).Trim()
          "runner-image=$env:ImageOS@$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "dotnet-sdk=$(dotnet --version)" >> $env:GITHUB_OUTPUT
          "tested-sha=$testedSha" >> $env:GITHUB_OUTPUT
          Write-Host "tested-sha=$testedSha"

      - name: Run governed PostgreSQL profile members
        timeout-minutes: 55
        id: postgres-tests
        shell: pwsh
        run: |
          $members = @('inventory-postgres-profile', 'masterdata-postgres-profile', 'scheduling-postgres-profile', 'apphub-postgres-profile', 'barcodelabel-postgres-profile', 'filestorage-postgres-profile', 'industrialtelemetry-postgres-profile', 'quality-postgres-profile', 'mes-postgres-profile', 'wms-postgres-profile', 'erp-postgres-profile', 'demandplanning-postgres-profile', 'acceptance-postgres-profile', 'maintenance-device-pause-postgres')
          ./scripts/run-postgres-test-lane.ps1 `
            -MemberId $members `
            -DatabaseSuffix ${{ github.run_id }}_${{ github.run_attempt }} `
            -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/postgres `
            -SummaryPath artifacts/postgres-test-lane/${{ github.run_id }}/attempt-${{ github.run_attempt }}/summary.json

      - name: Collect PostgreSQL profile evidence
        timeout-minutes: 5
        id: collect-postgres-evidence
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: >-
          ./scripts/collect-test-evidence.ps1
          -Lane postgres
          -SelectedLanes postgres
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/postgres
          -OutputDirectory artifacts/test-evidence/${{ github.run_id }}/attempt-${{ github.run_attempt }}/postgres
          -WorkflowRunId ${{ github.run_id }}
          -RunAttempt ${{ github.run_attempt }}
          -HeadSha ${{ github.event.pull_request.head.sha || github.sha }}
          -TestedSha ${{ steps.postgres-evidence-environment.outputs.tested-sha }}
          -RunnerOs ${{ runner.os }}
          -Repository ${{ github.repository }}
          -JobName "PostgreSQL Provider Tests"
          -CurrentTestOutcome ${{ steps.postgres-tests.outcome }}
          -Event ${{ github.event_name }}
          -HeadBranch $env:HEAD_BRANCH
          -SourceUrl ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          -RunnerImage ${{ steps.postgres-evidence-environment.outputs.runner-image }}
          -DotnetSdk ${{ steps.postgres-evidence-environment.outputs.dotnet-sdk }}
          -ArtifactName test-evidence-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          -RetentionDays 14
          -StepSummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Upload PostgreSQL normalized evidence
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect-postgres-evidence.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload PostgreSQL dependency summary
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-dependency-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/postgres-test-lane/${{ github.run_id }}/attempt-${{ github.run_attempt }}/summary.json
          if-no-files-found: error
          retention-days: 14

  redis-cap-transport-tests:
    name: Redis/CAP Transport Tests
    # NERV-688 拆解④：DemandPlanning 的两条真实 Redis Streams/CAP 传输证明。
    # 层级 A；显式 step 预算合计 59m，小于 66m job 预算，为 service setup 和 action post steps 保留 7m。
    timeout-minutes: 66
    runs-on: ubuntu-latest
    needs: impact-plan
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' || needs.impact-plan.result != 'success' || needs.impact-plan.outputs.redis_cap != 'false') }}
    env:
      NERV_IIP_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=nerv;Password=nerv
      NERV_IIP_TEST_REDIS: 127.0.0.1:6379
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nerv
          POSTGRES_PASSWORD: nerv
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nerv -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        timeout-minutes: 8
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Verify PostgreSQL client
        timeout-minutes: 1
        shell: bash
        run: |
          # NERV-1854：与 PostgreSQL Provider Tests 同源——psql 由 runner 镜像预装的 PostgreSQL 16
          # 提供，原先那次 `apt-get install postgresql-client` 只装了一个空壳元包，删掉它可以让本 job
          # 的 apt 面从两个包缩到一个包（redis-tools），命中概率同比下降。断言零网络、失败大声。
          if ! command -v psql >/dev/null 2>&1; then
            echo "::error::runner 镜像未预装 psql，Redis/CAP lane 无法运行。请在本步骤改回受控的 apt 安装（并按 NERV-1854 摘掉 azure 镜像），不要放任下游 lane 以「命令找不到」失败。" >&2
            exit 1
          fi
          psql --version

      - name: Install Redis client
        timeout-minutes: 4
        shell: bash
        run: |
          # NERV-1854：redis-tools 与 psql 不同，runner 镜像确实没有预装（成功日志里 libjemalloc2、
          # liblzf1、redis-tools 三个包都是真装进去的），因此这里仍然需要 apt，但要先把确定性挂死源
          # 摘掉再谈重试：
          # 1) 摘 azure 镜像。/etc/apt/apt-mirrors.txt 的 priority:1 是 http://azure.archive.ubuntu.com，
          #    2026-08-19 的多次失败日志里它对四个 suite 的 InRelease 全是 `Ign:`（连接超时），apt 之后
          #    才回落到 https://archive.ubuntu.com。这段等待对每次尝试都必然重复支付，是重试无效的根因；
          #    删掉该行后剩下的 archive/security 两个 https 镜像依旧构成完整的 suite 覆盖。
          # 2) 把 apt 自身的传输层重试压到 1 次。原先的 `Acquire::Retries=3` 会让每个索引在不可达镜像
          #    上按退避重试三轮，把单次尝试的浪费成倍放大，与外层重试叠加后彻底吃掉 step 预算。
          # 3) 加短连接超时与 `Acquire::Languages=none`：前者让不可达镜像快速失败而不是慢速拖死，后者
          #    去掉纯属浪费的 Translation-* 下载。
          # 已安装则整步跳过：镜像若将来预装 redis-tools，本步骤自动退化为零网络。
          if command -v redis-cli >/dev/null 2>&1; then
            echo "redis-cli 已由 runner 镜像提供，跳过 apt 安装。"
            redis-cli --version
            exit 0
          fi

          mirror_list=/etc/apt/apt-mirrors.txt
          if [ -f "${mirror_list}" ]; then
            remaining=$(grep -cv 'azure\.archive\.ubuntu\.com' "${mirror_list}" || true)
            if [ "${remaining}" -gt 0 ]; then
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' "${mirror_list}"
              echo "已从 ${mirror_list} 摘除 azure 镜像，剩余镜像："
              cat "${mirror_list}"
            else
              echo "::warning::${mirror_list} 除 azure 镜像外没有其他条目，保持原样以免把镜像列表清空。"
            fi
          else
            echo "::warning::${mirror_list} 不存在（runner 镜像形态已变），跳过镜像摘除，直接按原有软件源安装。"
          fi

          # 预算算术：单次尝试 60s × 最多 3 次 + 2 次重试间隔 5s = 最坏 190s，严格小于本 step 的
          # timeout-minutes 预算 4 分钟（240s）。`timeout` 放在 `sudo` 之后，以 root 身份终止挂死的
          # apt-get 进程组（否则 SIGTERM 因 EPERM 送不到 root 子进程，重试会被孤儿进程的 dpkg 锁挡死，
          # 这一点在 NERV-1713 的 Playwright 步骤上已经实证过）。
          apt_options='-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Languages=none'
          apt_attempt=1
          while true; do
            if sudo timeout 60 bash -c "apt-get ${apt_options} update && apt-get ${apt_options} install --yes --no-install-recommends redis-tools"; then
              echo "redis-tools 安装成功（第 ${apt_attempt} 次尝试）。"
              break
            fi
            if [ "${apt_attempt}" -ge 3 ]; then
              echo "::error::redis-tools 安装失败：已连续尝试 3 次仍未成功（软件源不可用），失败退出。" >&2
              exit 1
            fi
            echo "redis-tools 安装第 ${apt_attempt} 次尝试失败（超时或网络故障），5 秒后重试。" >&2
            apt_attempt=$((apt_attempt + 1))
            sleep 5
          done
          redis-cli --version

      - name: Resolve Redis/CAP evidence environment
        timeout-minutes: 3
        id: redis-cap-evidence-environment
        shell: pwsh
        run: |
          $testedSha = (git rev-parse HEAD).Trim()
          "runner-image=$env:ImageOS@$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "dotnet-sdk=$(dotnet --version)" >> $env:GITHUB_OUTPUT
          "tested-sha=$testedSha" >> $env:GITHUB_OUTPUT
          Write-Host "tested-sha=$testedSha"

      - name: Run DemandPlanning Redis/CAP transport profiles
        timeout-minutes: 20
        id: redis-cap-tests
        shell: pwsh
        run: |
          ./scripts/run-redis-cap-test-lane.ps1 `
            -MemberId demandplanning-sales-order-redis-cap `
            -DatabaseSuffix ${{ github.run_id }}_${{ github.run_attempt }} `
            -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/redis-cap `
            -SummaryPath artifacts/redis-cap-test-lane/${{ github.run_id }}/attempt-${{ github.run_attempt }}/summary.json

      - name: Collect Redis/CAP transport evidence
        timeout-minutes: 5
        id: collect-redis-cap-evidence
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: >-
          ./scripts/collect-test-evidence.ps1
          -Lane redis-cap
          -SelectedLanes redis-cap
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/redis-cap
          -OutputDirectory artifacts/test-evidence/${{ github.run_id }}/attempt-${{ github.run_attempt }}/redis-cap
          -WorkflowRunId ${{ github.run_id }}
          -RunAttempt ${{ github.run_attempt }}
          -HeadSha ${{ github.event.pull_request.head.sha || github.sha }}
          -TestedSha ${{ steps.redis-cap-evidence-environment.outputs.tested-sha }}
          -RunnerOs ${{ runner.os }}
          -Repository ${{ github.repository }}
          -JobName "Redis/CAP Transport Tests"
          -CurrentTestOutcome ${{ steps.redis-cap-tests.outcome }}
          -Event ${{ github.event_name }}
          -HeadBranch $env:HEAD_BRANCH
          -SourceUrl ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          -RunnerImage ${{ steps.redis-cap-evidence-environment.outputs.runner-image }}
          -DotnetSdk ${{ steps.redis-cap-evidence-environment.outputs.dotnet-sdk }}
          -ArtifactName test-evidence-redis-cap-${{ github.run_id }}-${{ github.run_attempt }}
          -RetentionDays 14
          -StepSummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Upload Redis/CAP normalized evidence
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-redis-cap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect-redis-cap-evidence.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Redis/CAP dependency summary
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redis-cap-dependency-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/redis-cap-test-lane/${{ github.run_id }}/attempt-${{ github.run_attempt }}/summary.json
          if-no-files-found: error
          retention-days: 14

  acceptance-scenario-matrix-planning:
    name: Business FullChain Acceptance / Planning
    timeout-minutes: 55
    runs-on: ubuntu-latest
    needs: impact-plan
    outputs:
      sales-order-demand-selected: ${{ steps.plan.outputs.sales-order-demand-selected }}
      tested-sha: ${{ steps.plan.outputs.tested-sha }}
      manifest-digest: ${{ steps.plan.outputs.manifest-digest }}
      artifact-digest: ${{ steps.plan.outputs.artifact-digest }}
      artifact-name: ${{ steps.planning-artifact-identity.outputs.artifact-name }}
      producer-run-attempt: ${{ steps.planning-artifact-identity.outputs.producer-run-attempt }}
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' || needs.impact-plan.result != 'success' || needs.impact-plan.outputs.full_chain != 'false') }}
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate CI impact-plan artifact identity
        timeout-minutes: 1
        if: ${{ github.event_name == 'pull_request' && needs.impact-plan.result == 'success' }}
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          ARTIFACT_NAME: ${{ needs.impact-plan.outputs.artifact-name }}
          PRODUCER_RUN_ATTEMPT: ${{ needs.impact-plan.outputs.producer-run-attempt }}
        run: |
          case "$PRODUCER_RUN_ATTEMPT" in
            ''|*[!0-9]*|0|0*) echo "Impact-plan producer run attempt is not canonical." >&2; exit 1 ;;
          esac
          test "$ARTIFACT_NAME" = "ci-impact-plan-${GITHUB_RUN_ID}-${PRODUCER_RUN_ATTEMPT}"

      - name: Download CI impact plan
        timeout-minutes: 3
        if: ${{ github.event_name == 'pull_request' && needs.impact-plan.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.impact-plan.outputs.artifact-name }}
          path: artifacts/ci-impact-plan

      - name: Plan acceptance scenario matrix
        timeout-minutes: 30
        id: plan
        shell: pwsh
        run: |
          $eventName = '${{ github.event_name }}'
          $impactRulesSucceeded = $eventName -ne 'pull_request' -or '${{ needs.impact-plan.result }}' -eq 'success'
          $changedPaths = @()
          if ($eventName -eq 'pull_request' -and $impactRulesSucceeded) {
            $impactPlan = Get-Content -LiteralPath artifacts/ci-impact-plan/impact-plan.json -Raw | ConvertFrom-Json
            $changedPaths = @($impactPlan.changed_paths | ForEach-Object { [string]$_ })
          }
          $testedSha = (git rev-parse HEAD).Trim()
          ./scripts/plan-acceptance-scenario-matrix.ps1 `
            -Event $eventName `
            -ChangedPaths $changedPaths `
            -ImpactRulesSucceeded $impactRulesSucceeded `
            -Repository '${{ github.repository }}' `
            -TestedSha $testedSha `
            -RunId '${{ github.run_id }}' `
            -RunAttempt ${{ github.run_attempt }}
          $planningPath = 'artifacts/acceptance-scenario-matrix/planning.json'
          $planningBytes = [IO.File]::ReadAllBytes($planningPath)
          $planning = [Text.UTF8Encoding]::new($false, $true).GetString($planningBytes) | ConvertFrom-Json -Depth 50 -DateKind String
          $salesMatches = @($planning.scenarios | Where-Object { [string]::Equals([string]$_.id, 'sales-order-demand', [StringComparison]::Ordinal) })
          if ($salesMatches.Count -gt 1) { throw "Planning artifact selected sales-order-demand more than once." }
          $sha256 = [Security.Cryptography.SHA256]::Create()
          try { $artifactDigest = ([Convert]::ToHexString($sha256.ComputeHash($planningBytes))).ToLowerInvariant() }
          finally { $sha256.Dispose() }
          "sales-order-demand-selected=$($salesMatches.Count -eq 1)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          "tested-sha=$([string]$planning.testedSha)" >> $env:GITHUB_OUTPUT
          "manifest-digest=$([string]$planning.manifestDigest)" >> $env:GITHUB_OUTPUT
          "artifact-digest=$artifactDigest" >> $env:GITHUB_OUTPUT

      - name: Resolve planning artifact identity
        timeout-minutes: 1
        id: planning-artifact-identity
        shell: pwsh
        run: |
          "artifact-name=acceptance-scenario-matrix-plan-${{ github.run_id }}-${{ github.run_attempt }}" >> $env:GITHUB_OUTPUT
          "producer-run-attempt=${{ github.run_attempt }}" >> $env:GITHUB_OUTPUT

      - name: Upload acceptance scenario matrix plan
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.planning-artifact-identity.outputs.artifact-name }}
          path: artifacts/acceptance-scenario-matrix/planning.json
          if-no-files-found: error
          retention-days: 14

  acceptance-scenario-matrix-runtime:
    name: Business FullChain Acceptance / sales-order-demand
    # 显式 step 预算合计 101m，小于 110m job 预算，为 action setup/post 保留 9m。
    timeout-minutes: 110
    runs-on: ubuntu-latest
    needs: acceptance-scenario-matrix-planning
    outputs:
      artifact-name: ${{ steps.shadow-artifact-identity.outputs.artifact-name }}
      producer-run-attempt: ${{ steps.shadow-artifact-identity.outputs.producer-run-attempt }}
    if: ${{ !cancelled() && needs.acceptance-scenario-matrix-planning.result == 'success' && needs.acceptance-scenario-matrix-planning.outputs.sales-order-demand-selected == 'true' }}
    env:
      NERV_IIP_TEST_POSTGRES: Host=127.0.0.1;Port=15432;Database=nerv_iip;Username=nerv;Password=nerv
      NERV_IIP_TEST_REDIS: 127.0.0.1:6379
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        timeout-minutes: 8
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Validate planning artifact identity
        timeout-minutes: 1
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          ARTIFACT_NAME: ${{ needs.acceptance-scenario-matrix-planning.outputs.artifact-name }}
          PRODUCER_RUN_ATTEMPT: ${{ needs.acceptance-scenario-matrix-planning.outputs.producer-run-attempt }}
        run: |
          case "$PRODUCER_RUN_ATTEMPT" in
            ''|*[!0-9]*|0|0*) echo "Planning producer run attempt is not canonical." >&2; exit 1 ;;
          esac
          test "$ARTIFACT_NAME" = "acceptance-scenario-matrix-plan-${GITHUB_RUN_ID}-${PRODUCER_RUN_ATTEMPT}"

      - name: Download acceptance scenario matrix plan
        timeout-minutes: 3
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.acceptance-scenario-matrix-planning.outputs.artifact-name }}
          path: artifacts/acceptance-scenario-matrix

      - name: Prepare shadow dependency images
        timeout-minutes: 10
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          # `verify-erp-sales-order-demand-planning.ps1` 使用 `docker compose up --pull never`；
          # hosted runner 必须先具备与 compose 契约一致的两个精确镜像。沿用 v1 的有限重试形状：
          # 单次最多 2 × (75s + 10s SIGKILL 兜底) = 170s，最多 3 次并含两次 15s 退避，
          # 最坏 540s，严格小于本 step 的 600s 预算。
          docker_attempt=1
          while true; do
            if { docker image inspect postgres:18 >/dev/null 2>&1 || timeout --kill-after=10 75 docker pull postgres:18; } \
              && { docker image inspect redis:8 >/dev/null 2>&1 || timeout --kill-after=10 75 docker pull redis:8; }; then
              echo "Shadow 依赖镜像准备成功（第 ${docker_attempt} 次尝试）。"
              break
            fi
            if [ "${docker_attempt}" -ge 3 ]; then
              echo "Shadow 依赖镜像拉取失败：已连续尝试 3 次仍未成功。" >&2
              exit 1
            fi
            echo "Shadow 依赖镜像拉取第 ${docker_attempt} 次尝试失败，15 秒后重试。" >&2
            docker_attempt=$((docker_attempt + 1))
            sleep 15
          done

      - name: Run acceptance scenario matrix
        timeout-minutes: 45
        id: acceptance-scenario-runtime
        shell: pwsh
        run: |
          $artifactPath = [IO.Path]::GetFullPath('artifacts/acceptance-scenario-matrix/planning.json')
          $artifactBytes = [IO.File]::ReadAllBytes($artifactPath)
          $sha256 = [Security.Cryptography.SHA256]::Create()
          try { $artifactDigest = ([Convert]::ToHexString($sha256.ComputeHash($artifactBytes))).ToLowerInvariant() }
          finally { $sha256.Dispose() }
          if (-not [string]::Equals($artifactDigest, '${{ needs.acceptance-scenario-matrix-planning.outputs.artifact-digest }}', [StringComparison]::Ordinal)) {
            throw 'Downloaded planning artifact digest does not match the planning job output.'
          }
          $manifestDigest = '${{ needs.acceptance-scenario-matrix-planning.outputs.manifest-digest }}'
          ./scripts/run-acceptance-scenario-matrix.ps1 `
            -ArtifactPath $artifactPath `
            -ExpectedArtifactDigest $artifactDigest `
            -ExpectedManifestDigest $manifestDigest `
            -Repository '${{ github.repository }}' `
            -TestedSha '${{ needs.acceptance-scenario-matrix-planning.outputs.tested-sha }}' `
            -RunId '${{ github.run_id }}' `
            -RunAttempt '${{ github.run_attempt }}' `
            -PlanningRunAttempt '${{ needs.acceptance-scenario-matrix-planning.outputs.producer-run-attempt }}' `
            -Event '${{ github.event_name }}' `
            -SummaryPath artifacts/acceptance-scenario-matrix/shadow/runtime-summary.json `
            -CanonicalResultPath artifacts/acceptance-scenario-matrix/shadow/sales-order-demand-result.json `
            -TrackIdentifier 'shadow'

      - name: Upload shadow runtime summary
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-scenario-matrix-runtime-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/acceptance-scenario-matrix/shadow/runtime-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Resolve shadow canonical artifact identity
        timeout-minutes: 1
        id: shadow-artifact-identity
        if: always()
        shell: pwsh
        run: |
          "artifact-name=acceptance-scenario-matrix-result-shadow-${{ github.run_id }}-${{ github.run_attempt }}" >> $env:GITHUB_OUTPUT
          "producer-run-attempt=${{ github.run_attempt }}" >> $env:GITHUB_OUTPUT

      - name: Upload shadow canonical result
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.shadow-artifact-identity.outputs.artifact-name }}
          path: artifacts/acceptance-scenario-matrix/shadow/sales-order-demand-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload shadow business evidence
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-scenario-matrix-business-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/acceptance/man517/sales-order-demand-planning-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload shadow cleanup evidence
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-scenario-matrix-cleanup-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/acceptance/man517/cleanup-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload shadow failure diagnostics
        timeout-minutes: 5
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-scenario-matrix-diagnostics-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/acceptance/man517/diagnostics/**
            artifacts/script-logs/man517-*
          if-no-files-found: error
          retention-days: 14

  business-full-chain-acceptance-v1:
    name: Business FullChain Acceptance / v1 Authority
    # NERV-767：五条 active/core 跨服务真实依赖场景。层级 A；显式 step
    # 预算合计 220m，小于 225m job 预算，为 Docker/Aspire setup 与 action post
    # steps 保留 5m。场景顺序执行，避免共享端口和固定服务画像并发冲突。
    timeout-minutes: 225
    runs-on: ubuntu-latest
    needs: acceptance-scenario-matrix-planning
    outputs:
      artifact-name: ${{ steps.v1-artifact-identity.outputs.artifact-name }}
      producer-run-attempt: ${{ steps.v1-artifact-identity.outputs.producer-run-attempt }}
    if: ${{ needs.acceptance-scenario-matrix-planning.result == 'success' }}
    env:
      NERV_IIP_TEST_POSTGRES: Host=127.0.0.1;Port=15432;Database=postgres;Username=nerv;Password=nerv
      NERV_IIP_TEST_REDIS: 127.0.0.1:6379
      COMPOSE_PROJECT_NAME: nerv_full_chain_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        timeout-minutes: 8
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup Aspire CLI
        timeout-minutes: 10
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          # NERV-1701：下载 install.sh 与执行该安装脚本是两个各自独立的挂死面（安装脚本内部还要
          # 再拉一次 CLI 归档），任一处挂死都会卡满 step 预算，因此沿用 NERV-1694 的「单次尝试
          # 超时 + 有限重试」形状，把挂死转成快速失败再重试，而不是放大 step 预算。
          # 重试范围覆盖「下载 + 执行安装脚本」两条命令：它们属于同一逻辑单元。重跑安装脚本按其
          # 自身语义应当是幂等的（同一 --install-path 覆盖安装），但这一点不由本仓库保证；真正的
          # 兜底是紧随循环之后的版本校验——被 SIGKILL 打断留下的半成品若没被下一次尝试覆盖干净，
          # 会在那里被抓红而不是带病继续。
          # 版本校验与 PATH 导出刻意留在重试范围之外：它们不是网络动作，装出来的版本不对属于确定性
          # 故障，重试只会白白烧掉预算，应当直接大声失败。
          # 预算算术：单次尝试 = curl 45s（外加最多 10s 的 SIGKILL 兜底）+ 安装脚本 105s（外加最多
          # 15s 兜底）= 175s；×最多 3 次 + 2 次重试间隔 10s = 最坏 545s，严格小于本 step 既有的
          # timeout-minutes 预算 10 分钟（600s），因此本次不改动任何超时预算。
          # curl 另加 --max-time / --retry 作为传输层重试（最坏 3×12+2×2=40s，仍小于外层 45s），
          # 与外层重试互补，同 apt 那处的 -o Acquire::Retries=3 思路。
          # 非 root 场景一律加 --kill-after 兜底，否则 SIGTERM 被忽略时 timeout 自己挂住，会退化
          # 回卡满预算。
          aspire_install_path="${RUNNER_TEMP}/aspire/bin"
          aspire_attempt=1
          while true; do
            if timeout --kill-after=10 45 curl --fail --silent --show-error --location --max-time 12 --retry 2 --retry-delay 2 https://aspire.dev/install.sh --output "${RUNNER_TEMP}/aspire-install.sh" \
              && timeout --kill-after=15 105 bash "${RUNNER_TEMP}/aspire-install.sh" --version 13.4.6 --install-path "$aspire_install_path"; then
              echo "Aspire CLI 安装成功（第 ${aspire_attempt} 次尝试）。"
              break
            fi
            if [ "${aspire_attempt}" -ge 3 ]; then
              echo "Aspire CLI 安装失败：已连续尝试 3 次仍未成功（多为网络挂死或分发端不可用），失败退出。" >&2
              exit 1
            fi
            echo "Aspire CLI 安装第 ${aspire_attempt} 次尝试失败（超时或网络故障），10 秒后重试。" >&2
            aspire_attempt=$((aspire_attempt + 1))
            sleep 10
          done
          "$aspire_install_path/aspire" --version | grep -E '^13\.4\.6\+'
          echo "$aspire_install_path" >> "$GITHUB_PATH"

      - name: Setup pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        timeout-minutes: 12
        run: |
          # NERV-1701：pnpm install 同样没有单次尝试超时和重试，registry 侧挂死会卡满 step 预算，
          # 因此沿用 NERV-1694 的「单次尝试超时 + 有限重试」形状。
          # 单次尝试取 200s；本仓库没有冷缓存安装耗时的实测数据，若某次冷缓存安装确实超过 200s，
          # 重试仍是收敛的：被打断的那次已经把下载到的包写进了 pnpm store（内容寻址、先写临时再
          # 改名），下一次尝试直接命中 store 而不会从零重来。
          # 本块在 workflow 里重复 4 处而没有抽成 composite action：抽走会让 ci.yml 里不再出现
          # `pnpm -C frontend install --frozen-lockfile` 字面量，直接打破
          # scripts/tests/full-chain-test-lane.Tests.ps1 的逐字契约断言，故保持逐处加固。
          # 预算算术：单次尝试 200s（外加最多 20s 的 SIGKILL 兜底）× 最多 3 次 + 2 次重试间隔 15s
          # = 最坏 690s，严格小于本 step 既有的 timeout-minutes 预算 12 分钟（720s），因此本次不
          # 改动任何超时预算。
          pnpm_attempt=1
          while true; do
            if timeout --kill-after=20 200 pnpm -C frontend install --frozen-lockfile; then
              echo "前端依赖安装成功（第 ${pnpm_attempt} 次尝试）。"
              break
            fi
            if [ "${pnpm_attempt}" -ge 3 ]; then
              echo "前端依赖安装失败：已连续尝试 3 次仍未成功（多为网络挂死或 registry 不可用），失败退出。" >&2
              exit 1
            fi
            echo "前端依赖安装第 ${pnpm_attempt} 次尝试失败（超时或网络故障），15 秒后重试。" >&2
            pnpm_attempt=$((pnpm_attempt + 1))
            sleep 15
          done

      - name: Install Playwright Chromium
        timeout-minutes: 15
        run: |
          # NERV-1694：Playwright 安装（含 `--with-deps` 内部触发的 apt）会挂死到 15 分钟 step
          # 预算，而成功路径实测只需约 3 分钟；因此同样改为「单次尝试超时 + 有限重试」。
          # NERV-1713：上面那套重试在带 `--with-deps` 时是无效的，已由 run 32216581187 实证——挂死
          # 发生在 `--with-deps` 内部 `Switching to root user` 起的 `sudo apt-get` 里，而这里的
          # `timeout` 是 runner 身份，SIGTERM/SIGKILL 因 EPERM 送不到那个 root 子进程；它成为孤儿
          # 并继续持有 /var/lib/apt/lists/lock，第 2、3 次重试各只跑 3 秒就被同一个 PID 的锁挡死。
          # `--kill-after` 只能保证外层 pnpm/node 被清掉、step 按时进入重试，清不掉 root 子进程。
          # 因此本次去掉 `--with-deps`：apt 挂死面与孤儿锁面一起消失，本步骤只剩浏览器归档下载，
          # 全程 runner 身份、可被 `timeout` 精确终止，重试才真正成立。
          # 系统依赖改由 ubuntu-latest runner 镜像的预装承担：该镜像预装 Google Chrome、Chromium、
          # Microsoft Edge 与 Firefox，Playwright 对 ubuntu24.04-x64 声明的 chromium 依赖集合
          # （libnss3、libnspr4、libgbm1、libdrm2、libasound2t64、libatk-bridge2.0-0t64、
          # libcups2t64、libxkbcommon0 等）都落在这些浏览器 deb 包的依赖闭包内。这一点是包级论证而
          # 不是运行时观测，真正的验收是 FullChain 里那次真实代理页面走查：Chromium 起不来时
          # Playwright 会明确列出缺失的库并让该 lane 失败关闭，属于大声失败而不是静默降级。届时应当
          # 单列一个受控的系统依赖安装步骤，而不是把 apt 挂死面塞回本步骤。
          # 预算算术：单次尝试 240s（外加最多 30s 的 SIGKILL 兜底）× 最多 3 次 + 2 次重试间隔 5s
          # = 最坏 820s，严格小于本 step 既有的 timeout-minutes 预算 15 分钟（900s），故不改超时预算。
          playwright_attempt=1
          while true; do
            if timeout --kill-after=30 240 pnpm -C frontend --filter @nerv-iip/business-console exec playwright install chromium; then
              echo "Playwright Chromium 安装成功（第 ${playwright_attempt} 次尝试）。"
              break
            fi
            if [ "${playwright_attempt}" -ge 3 ]; then
              echo "Playwright Chromium 安装失败：已连续尝试 3 次仍未成功，失败退出。" >&2
              exit 1
            fi
            echo "Playwright Chromium 安装第 ${playwright_attempt} 次尝试失败（超时或网络故障），5 秒后重试。" >&2
            playwright_attempt=$((playwright_attempt + 1))
            sleep 5
          done

      - name: Prepare FullChain dependency images
        timeout-minutes: 10
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          # NERV-1701：docker pull 既没有单次尝试超时也没有重试，registry 侧限流或连接挂死都会
          # 卡满 step 预算，因此沿用 NERV-1694 的「单次尝试超时 + 有限重试」形状。
          # 与 apt 的失败语义有两点差异，实现上据此调整：
          # 1) 常见成因是 registry 限流（HTTP 429）而不是纯粹挂死，退避需要更长，故重试间隔取
          #    15s（apt 那处是 5s）。
          # 2) 先用 docker image inspect 探测本地是否已有该镜像，已有则跳过拉取；这样上一次尝试
          #    里已经拉成功的镜像不会在重试时被重复拉，重试代价只落在真正失败的那一个上。
          # 两条 pull 属于同一逻辑单元，放在同一次尝试内（任一条失败即整体重试），避免每次尝试的
          # 最坏耗时翻倍。
          # 预算算术：单次尝试 = 2 × 75s（各自外加最多 10s 的 SIGKILL 兜底）= 170s；×最多 3 次
          # + 2 次重试间隔 15s = 最坏 540s，严格小于本 step 既有的 timeout-minutes 预算 10 分钟
          # （600s），因此本次不改动任何超时预算。
          docker_attempt=1
          while true; do
            if { docker image inspect postgres:18 >/dev/null 2>&1 || timeout --kill-after=10 75 docker pull postgres:18; } \
              && { docker image inspect redis:8 >/dev/null 2>&1 || timeout --kill-after=10 75 docker pull redis:8; }; then
              echo "依赖镜像准备成功（第 ${docker_attempt} 次尝试）。"
              break
            fi
            if [ "${docker_attempt}" -ge 3 ]; then
              echo "依赖镜像拉取失败：已连续尝试 3 次仍未成功（多为 registry 限流或网络挂死），失败退出。" >&2
              exit 1
            fi
            echo "依赖镜像拉取第 ${docker_attempt} 次尝试失败（超时或网络故障），15 秒后重试。" >&2
            docker_attempt=$((docker_attempt + 1))
            sleep 15
          done

      - name: Resolve FullChain evidence environment
        timeout-minutes: 3
        id: full-chain-evidence-environment
        shell: pwsh
        run: |
          $testedSha = (git rev-parse HEAD).Trim()
          "runner-image=$env:ImageOS@$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "dotnet-sdk=$(dotnet --version)" >> $env:GITHUB_OUTPUT
          "tested-sha=$testedSha" >> $env:GITHUB_OUTPUT
          Write-Host "tested-sha=$testedSha"

      - name: Run governed FullChain scenarios
        timeout-minutes: 120
        id: full-chain-tests
        shell: pwsh
        run: |
          $v1CanonicalResultPath = [IO.Path]::GetFullPath('artifacts/acceptance-scenario-matrix/v1/sales-order-demand-result.json')
          ./scripts/run-full-chain-test-lane.ps1 `
            -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/full-chain `
            -SummaryPath artifacts/full-chain-test-lane/${{ github.run_id }}/attempt-${{ github.run_attempt }}/summary.json `
            -CanonicalResultPath $v1CanonicalResultPath `
            -TrackIdentifier 'v1' `
            -Repository '${{ github.repository }}' `
            -RunId '${{ github.run_id }}' `
            -RunAttempt '${{ github.run_attempt }}' `
            -TestedSha '${{ needs.acceptance-scenario-matrix-planning.outputs.tested-sha }}' `
            -ManifestDigest '${{ needs.acceptance-scenario-matrix-planning.outputs.manifest-digest }}' `
            -ScenarioId 'sales-order-demand'

      - name: Resolve v1 canonical artifact identity
        timeout-minutes: 1
        id: v1-artifact-identity
        shell: pwsh
        run: |
          "artifact-name=acceptance-scenario-matrix-result-v1-${{ github.run_id }}-${{ github.run_attempt }}" >> $env:GITHUB_OUTPUT
          "producer-run-attempt=${{ github.run_attempt }}" >> $env:GITHUB_OUTPUT

      - name: Upload v1 sales-order-demand canonical result
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.v1-artifact-identity.outputs.artifact-name }}
          path: artifacts/acceptance-scenario-matrix/v1/sales-order-demand-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Collect FullChain evidence
        timeout-minutes: 5
        id: collect-full-chain-evidence
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: >-
          ./scripts/collect-test-evidence.ps1
          -Lane full-chain
          -SelectedLanes full-chain
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/full-chain
          -OutputDirectory artifacts/test-evidence/${{ github.run_id }}/attempt-${{ github.run_attempt }}/full-chain
          -WorkflowRunId ${{ github.run_id }}
          -RunAttempt ${{ github.run_attempt }}
          -HeadSha ${{ github.event.pull_request.head.sha || github.sha }}
          -TestedSha ${{ steps.full-chain-evidence-environment.outputs.tested-sha }}
          -RunnerOs ${{ runner.os }}
          -Repository ${{ github.repository }}
          -JobName "Business FullChain Acceptance / v1 Authority"
          -CurrentTestOutcome ${{ steps.full-chain-tests.outcome }}
          -Event ${{ github.event_name }}
          -HeadBranch $env:HEAD_BRANCH
          -SourceUrl ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          -RunnerImage ${{ steps.full-chain-evidence-environment.outputs.runner-image }}
          -DotnetSdk ${{ steps.full-chain-evidence-environment.outputs.dotnet-sdk }}
          -ArtifactName test-evidence-full-chain-${{ github.run_id }}-${{ github.run_attempt }}
          -RetentionDays 14
          -StepSummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Upload FullChain normalized evidence
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-full-chain-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect-full-chain-evidence.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload FullChain dependency summary
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-chain-dependency-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/full-chain-test-lane/${{ github.run_id }}/attempt-${{ github.run_attempt }}/summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload FullChain failure diagnostics
        timeout-minutes: 5
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-chain-failure-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/acceptance/**
            artifacts/fullstack/**
            artifacts/script-logs/**
          if-no-files-found: error
          retention-days: 14

  business-full-chain-acceptance:
    name: Business FullChain Acceptance
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs:
      - impact-plan
      - acceptance-scenario-matrix-planning
      - business-full-chain-acceptance-v1
      - acceptance-scenario-matrix-runtime
      - acceptance-scenario-matrix-equivalence
    if: ${{ always() && (github.event_name != 'pull_request' || needs.impact-plan.result != 'success' || needs.impact-plan.outputs.full_chain != 'false') }}
    steps:
      - name: Require FullChain planning, v1 authority, and selected shadow equivalence
        timeout-minutes: 3
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          planning_result="${{ needs.acceptance-scenario-matrix-planning.result }}"
          v1_result="${{ needs.business-full-chain-acceptance-v1.result }}"
          sales_order_demand_selected="${{ needs.acceptance-scenario-matrix-planning.outputs.sales-order-demand-selected }}"
          shadow_result="${{ needs.acceptance-scenario-matrix-runtime.result }}"
          equivalence_result="${{ needs.acceptance-scenario-matrix-equivalence.result }}"

          test "$planning_result" = "success"
          test "$v1_result" = "success"
          case "$sales_order_demand_selected" in
            true)
              test "$shadow_result" = "success"
              test "$equivalence_result" = "success"
              ;;
            false)
              test "$shadow_result" = "skipped"
              test "$equivalence_result" = "skipped"
              ;;
            *)
              echo "sales-order-demand-selected must be exactly 'true' or 'false'." >&2
              exit 1
              ;;
          esac

  acceptance-scenario-matrix-equivalence:
    name: Business FullChain Acceptance / sales-order-demand equivalence (internal)
    timeout-minutes: 35
    runs-on: ubuntu-latest
    needs:
      - acceptance-scenario-matrix-planning
      - business-full-chain-acceptance-v1
      - acceptance-scenario-matrix-runtime
    if: ${{ !cancelled() && needs.acceptance-scenario-matrix-planning.result == 'success' && needs.acceptance-scenario-matrix-planning.outputs.sales-order-demand-selected == 'true' }}
    steps:
      - name: Require successful two-track prerequisites
        timeout-minutes: 3
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          PLANNING_ARTIFACT_NAME: ${{ needs.acceptance-scenario-matrix-planning.outputs.artifact-name }}
          PLANNING_ATTEMPT: ${{ needs.acceptance-scenario-matrix-planning.outputs.producer-run-attempt }}
          V1_ARTIFACT_NAME: ${{ needs.business-full-chain-acceptance-v1.outputs.artifact-name }}
          V1_ATTEMPT: ${{ needs.business-full-chain-acceptance-v1.outputs.producer-run-attempt }}
          SHADOW_ARTIFACT_NAME: ${{ needs.acceptance-scenario-matrix-runtime.outputs.artifact-name }}
          SHADOW_ATTEMPT: ${{ needs.acceptance-scenario-matrix-runtime.outputs.producer-run-attempt }}
        run: |
          test "${{ needs.business-full-chain-acceptance-v1.result }}" = "success"
          test "${{ needs.acceptance-scenario-matrix-runtime.result }}" = "success"
          validate_artifact_identity() {
            artifact_name="$1"
            producer_attempt="$2"
            expected_name="$3"
            case "$producer_attempt" in
              ''|*[!0-9]*|0|0*) echo "Producer run attempt is not canonical." >&2; exit 1 ;;
            esac
            test "$artifact_name" = "$expected_name"
          }
          validate_artifact_identity "$PLANNING_ARTIFACT_NAME" "$PLANNING_ATTEMPT" "acceptance-scenario-matrix-plan-${GITHUB_RUN_ID}-${PLANNING_ATTEMPT}"
          validate_artifact_identity "$V1_ARTIFACT_NAME" "$V1_ATTEMPT" "acceptance-scenario-matrix-result-v1-${GITHUB_RUN_ID}-${V1_ATTEMPT}"
          validate_artifact_identity "$SHADOW_ARTIFACT_NAME" "$SHADOW_ATTEMPT" "acceptance-scenario-matrix-result-shadow-${GITHUB_RUN_ID}-${SHADOW_ATTEMPT}"

      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Download acceptance scenario matrix plan
        timeout-minutes: 3
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.acceptance-scenario-matrix-planning.outputs.artifact-name }}
          path: artifacts/equivalence/planning

      - name: Download v1 canonical result
        timeout-minutes: 3
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.business-full-chain-acceptance-v1.outputs.artifact-name }}
          path: artifacts/equivalence/v1

      - name: Download shadow canonical result
        timeout-minutes: 3
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.acceptance-scenario-matrix-runtime.outputs.artifact-name }}
          path: artifacts/equivalence/shadow

      - name: Compare sales-order-demand tracks
        timeout-minutes: 5
        shell: pwsh
        run: |
          $artifactPath = 'artifacts/equivalence/planning/planning.json'
          $artifactBytes = [IO.File]::ReadAllBytes($artifactPath)
          $sha256 = [Security.Cryptography.SHA256]::Create()
          try { $artifactDigest = ([Convert]::ToHexString($sha256.ComputeHash($artifactBytes))).ToLowerInvariant() }
          finally { $sha256.Dispose() }
          if (-not [string]::Equals($artifactDigest, '${{ needs.acceptance-scenario-matrix-planning.outputs.artifact-digest }}', [StringComparison]::Ordinal)) {
            throw 'Downloaded planning artifact digest does not match the planning job output.'
          }
          ./scripts/verify-acceptance-scenario-matrix-equivalence.ps1 `
            -ArtifactPath $artifactPath `
            -ExpectedArtifactDigest $artifactDigest `
            -ExpectedManifestDigest '${{ needs.acceptance-scenario-matrix-planning.outputs.manifest-digest }}' `
            -Repository '${{ github.repository }}' `
            -TestedSha '${{ needs.acceptance-scenario-matrix-planning.outputs.tested-sha }}' `
            -RunId '${{ github.run_id }}' `
            -RunAttempt '${{ github.run_attempt }}' `
            -PlanningRunAttempt '${{ needs.acceptance-scenario-matrix-planning.outputs.producer-run-attempt }}' `
            -Event '${{ github.event_name }}' `
            -V1ResultPath artifacts/equivalence/v1/sales-order-demand-result.json `
            -V1RunAttempt '${{ needs.business-full-chain-acceptance-v1.outputs.producer-run-attempt }}' `
            -ShadowResultPath artifacts/equivalence/shadow/sales-order-demand-result.json `
            -ShadowRunAttempt '${{ needs.acceptance-scenario-matrix-runtime.outputs.producer-run-attempt }}' `
            -ReportPath artifacts/acceptance-scenario-matrix/equivalence-report.json

      - name: Upload sales-order-demand equivalence report
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-scenario-matrix-equivalence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/acceptance-scenario-matrix/equivalence-report.json
          if-no-files-found: error
          retention-days: 14

  connector-host-tests:
    name: Connector Host Tests
    # 层级 A（证据 step）。观测最大值为 1.9m / 平均值为 1.6m。这就是挂起 28m 的那个 job，
    # 该事件发生在 MAN-799 中。step 预算合计为 41m，为隐式 setup/post step 留下 9m 余量。
    timeout-minutes: 50
    runs-on: ubuntu-latest
    needs: impact-plan
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' || needs.impact-plan.result != 'success' || needs.impact-plan.outputs.connector_hosts != 'false') }}
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        timeout-minutes: 8
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props', 'connector-hosts/**/*.csproj', 'connector-hosts/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve test evidence environment
        timeout-minutes: 3
        id: connector-evidence-environment
        shell: pwsh
        run: |
          $testedSha = (git rev-parse HEAD).Trim()
          "runner-image=$env:ImageOS@$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "dotnet-sdk=$(dotnet --version)" >> $env:GITHUB_OUTPUT
          "tested-sha=$testedSha" >> $env:GITHUB_OUTPUT
          Write-Host "tested-sha=$testedSha"

      - name: Test connector host solution
        timeout-minutes: 12
        id: connector-host-tests
        run: >-
          dotnet test connector-hosts/Nerv.IIP.ConnectorHost.sln
          --configuration Release
          --logger trx
          --results-directory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/connector-host

      - name: Collect connector host test evidence
        timeout-minutes: 5
        id: collect-connector-host-evidence
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: >-
          ./scripts/collect-test-evidence.ps1
          -Lane connector-host
          -SelectedLanes connector-host
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/connector-host
          -OutputDirectory artifacts/test-evidence/${{ github.run_id }}/attempt-${{ github.run_attempt }}/connector-host
          -WorkflowRunId ${{ github.run_id }}
          -RunAttempt ${{ github.run_attempt }}
          -HeadSha ${{ github.event.pull_request.head.sha || github.sha }}
          -TestedSha ${{ steps.connector-evidence-environment.outputs.tested-sha }}
          -RunnerOs ${{ runner.os }}
          -Repository ${{ github.repository }}
          -JobName "Connector Host Tests"
          -CurrentTestOutcome ${{ steps.connector-host-tests.outcome }}
          -Event ${{ github.event_name }}
          -HeadBranch $env:HEAD_BRANCH
          -SourceUrl ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          -RunnerImage ${{ steps.connector-evidence-environment.outputs.runner-image }}
          -DotnetSdk ${{ steps.connector-evidence-environment.outputs.dotnet-sdk }}
          -ArtifactName test-evidence-connector-host-${{ github.run_id }}-${{ github.run_attempt }}
          -RetentionDays 14
          -StepSummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Upload connector host test evidence
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-connector-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect-connector-host-evidence.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 14

  frontend-unit-test-shards:
    name: Frontend Unit Test (${{ matrix.name }})
    needs: impact-plan
    if: needs.impact-plan.outputs.frontend_tests_selected == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.impact-plan.outputs.frontend_test_matrix) }}
    # 层级 A。每个受影响 workspace 独立产出 JUnit/JSON；测试失败后仍上传该 shard
    # 已生成的证据。3 + 3 + 5 + 12 + 20 + 5 = 48m < 55m。
    timeout-minutes: 55
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        timeout-minutes: 12
        run: |
          # NERV-1701：pnpm install 同样没有单次尝试超时和重试，registry 侧挂死会卡满 step 预算，
          # 因此沿用 NERV-1694 的「单次尝试超时 + 有限重试」形状。
          # 单次尝试取 200s；本仓库没有冷缓存安装耗时的实测数据，若某次冷缓存安装确实超过 200s，
          # 重试仍是收敛的：被打断的那次已经把下载到的包写进了 pnpm store（内容寻址、先写临时再
          # 改名），下一次尝试直接命中 store 而不会从零重来。
          # 本块在 workflow 里重复 4 处而没有抽成 composite action：抽走会让 ci.yml 里不再出现
          # `pnpm -C frontend install --frozen-lockfile` 字面量，直接打破
          # scripts/tests/full-chain-test-lane.Tests.ps1 的逐字契约断言，故保持逐处加固。
          # 预算算术：单次尝试 200s（外加最多 20s 的 SIGKILL 兜底）× 最多 3 次 + 2 次重试间隔 15s
          # = 最坏 690s，严格小于本 step 既有的 timeout-minutes 预算 12 分钟（720s），因此本次不
          # 改动任何超时预算。
          pnpm_attempt=1
          while true; do
            if timeout --kill-after=20 200 pnpm -C frontend install --frozen-lockfile; then
              echo "前端依赖安装成功（第 ${pnpm_attempt} 次尝试）。"
              break
            fi
            if [ "${pnpm_attempt}" -ge 3 ]; then
              echo "前端依赖安装失败：已连续尝试 3 次仍未成功（多为网络挂死或 registry 不可用），失败退出。" >&2
              exit 1
            fi
            echo "前端依赖安装第 ${pnpm_attempt} 次尝试失败（超时或网络故障），15 秒后重试。" >&2
            pnpm_attempt=$((pnpm_attempt + 1))
            sleep 15
          done

      - name: Test affected frontend workspace
        timeout-minutes: 20
        run: >-
          pnpm -C frontend --filter "${{ matrix.name }}" test
          --reporter=default
          --reporter=junit
          --reporter=json
          --outputFile.junit=artifacts/test-results/junit.xml
          --outputFile.json=artifacts/test-results/results.json
          --slowTestThreshold=1000

      - name: Upload frontend unit test shard evidence
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-test-evidence-${{ matrix.slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/apps/*/artifacts/test-results/*.xml
            frontend/apps/*/artifacts/test-results/*.json
            frontend/packages/*/artifacts/test-results/*.xml
            frontend/packages/*/artifacts/test-results/*.json
          if-no-files-found: error
          retention-days: 14

  frontend-unit-tests:
    name: Frontend Unit Tests
    if: always()
    needs:
      - impact-plan
      - frontend-unit-test-shards
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate frontend unit test shards
        timeout-minutes: 3
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMPACT_RESULT: ${{ needs.impact-plan.result }}
          FRONTEND_TESTS_SELECTED: ${{ needs.impact-plan.outputs.frontend_tests_selected }}
          SHARD_RESULT: ${{ needs.frontend-unit-test-shards.result }}
        run: |
          test "$IMPACT_RESULT" = "success"
          if test "$FRONTEND_TESTS_SELECTED" = "true"; then
            test "$SHARD_RESULT" = "success"
          else
            test "$FRONTEND_TESTS_SELECTED" = "false"
            test "$SHARD_RESULT" = "skipped"
          fi

  frontend-check:
    name: Frontend Check (Affected)
    needs: impact-plan
    if: needs.impact-plan.outputs.frontend_selected == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        timeout-minutes: 12
        run: |
          # NERV-1701：pnpm install 同样没有单次尝试超时和重试，registry 侧挂死会卡满 step 预算，
          # 因此沿用 NERV-1694 的「单次尝试超时 + 有限重试」形状。
          # 单次尝试取 200s；本仓库没有冷缓存安装耗时的实测数据，若某次冷缓存安装确实超过 200s，
          # 重试仍是收敛的：被打断的那次已经把下载到的包写进了 pnpm store（内容寻址、先写临时再
          # 改名），下一次尝试直接命中 store 而不会从零重来。
          # 本块在 workflow 里重复 4 处而没有抽成 composite action：抽走会让 ci.yml 里不再出现
          # `pnpm -C frontend install --frozen-lockfile` 字面量，直接打破
          # scripts/tests/full-chain-test-lane.Tests.ps1 的逐字契约断言，故保持逐处加固。
          # 预算算术：单次尝试 200s（外加最多 20s 的 SIGKILL 兜底）× 最多 3 次 + 2 次重试间隔 15s
          # = 最坏 690s，严格小于本 step 既有的 timeout-minutes 预算 12 分钟（720s），因此本次不
          # 改动任何超时预算。
          pnpm_attempt=1
          while true; do
            if timeout --kill-after=20 200 pnpm -C frontend install --frozen-lockfile; then
              echo "前端依赖安装成功（第 ${pnpm_attempt} 次尝试）。"
              break
            fi
            if [ "${pnpm_attempt}" -ge 3 ]; then
              echo "前端依赖安装失败：已连续尝试 3 次仍未成功（多为网络挂死或 registry 不可用），失败退出。" >&2
              exit 1
            fi
            echo "前端依赖安装第 ${pnpm_attempt} 次尝试失败（超时或网络故障），15 秒后重试。" >&2
            pnpm_attempt=$((pnpm_attempt + 1))
            sleep 15
          done

      - name: Check frontend format and lint
        timeout-minutes: 10
        run: pnpm -C frontend check

  frontend-validation-shards:
    name: Frontend Validation (${{ matrix.name }})
    needs: impact-plan
    if: needs.impact-plan.outputs.frontend_selected == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.impact-plan.outputs.frontend_validation_matrix) }}
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        timeout-minutes: 12
        run: |
          # NERV-1701：pnpm install 同样没有单次尝试超时和重试，registry 侧挂死会卡满 step 预算，
          # 因此沿用 NERV-1694 的「单次尝试超时 + 有限重试」形状。
          # 单次尝试取 200s；本仓库没有冷缓存安装耗时的实测数据，若某次冷缓存安装确实超过 200s，
          # 重试仍是收敛的：被打断的那次已经把下载到的包写进了 pnpm store（内容寻址、先写临时再
          # 改名），下一次尝试直接命中 store 而不会从零重来。
          # 本块在 workflow 里重复 4 处而没有抽成 composite action：抽走会让 ci.yml 里不再出现
          # `pnpm -C frontend install --frozen-lockfile` 字面量，直接打破
          # scripts/tests/full-chain-test-lane.Tests.ps1 的逐字契约断言，故保持逐处加固。
          # 预算算术：单次尝试 200s（外加最多 20s 的 SIGKILL 兜底）× 最多 3 次 + 2 次重试间隔 15s
          # = 最坏 690s，严格小于本 step 既有的 timeout-minutes 预算 12 分钟（720s），因此本次不
          # 改动任何超时预算。
          pnpm_attempt=1
          while true; do
            if timeout --kill-after=20 200 pnpm -C frontend install --frozen-lockfile; then
              echo "前端依赖安装成功（第 ${pnpm_attempt} 次尝试）。"
              break
            fi
            if [ "${pnpm_attempt}" -ge 3 ]; then
              echo "前端依赖安装失败：已连续尝试 3 次仍未成功（多为网络挂死或 registry 不可用），失败退出。" >&2
              exit 1
            fi
            echo "前端依赖安装第 ${pnpm_attempt} 次尝试失败（超时或网络故障），15 秒后重试。" >&2
            pnpm_attempt=$((pnpm_attempt + 1))
            sleep 15
          done

      - name: Typecheck affected frontend workspace
        if: matrix.run_typecheck
        timeout-minutes: 10
        run: pnpm -C frontend --filter "${{ matrix.name }}" typecheck

      - name: Build affected frontend app
        if: matrix.run_build
        timeout-minutes: 20
        run: pnpm -C frontend --filter "${{ matrix.name }}" build

  frontend:
    name: Frontend Typecheck and Build
    if: always()
    needs:
      - impact-plan
      - frontend-check
      - frontend-validation-shards
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate frontend validation shards
        timeout-minutes: 3
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMPACT_RESULT: ${{ needs.impact-plan.result }}
          FRONTEND_SELECTED: ${{ needs.impact-plan.outputs.frontend_selected }}
          CHECK_RESULT: ${{ needs.frontend-check.result }}
          VALIDATION_RESULT: ${{ needs.frontend-validation-shards.result }}
        run: |
          test "$IMPACT_RESULT" = "success"
          if test "$FRONTEND_SELECTED" = "true"; then
            test "$CHECK_RESULT" = "success"
            test "$VALIDATION_RESULT" = "success"
          else
            test "$FRONTEND_SELECTED" = "false"
            test "$CHECK_RESULT" = "skipped"
            test "$VALIDATION_RESULT" = "skipped"
          fi

  openapi-client-drift:
    name: OpenAPI/api-client Drift
    # 层级 B（失败后没有 step 运行）。观测最大值为 2.0m / 平均值为 1.8m；20m job 预算是
    # 快速失败界限。step 预算合计为 39m，且仅为逐 step 上限。
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: impact-plan
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' || needs.impact-plan.result != 'success' || needs.impact-plan.outputs.openapi_codegen != 'false') }}
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        timeout-minutes: 8
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Verify OpenAPI/api-client drift
        timeout-minutes: 15
        shell: pwsh
        run: ./scripts/verify-openapi-client-drift.ps1

  script-governance:
    name: Script Governance
    # 层级 B（失败后没有 step 运行）。已包含证据契约测试 step 的 run 中，观测最大值为 1.9m、平均值为 1.8m；
    # 本注释曾引用的 0.7m 平均值早于该证据契约测试 step。
    # 10m job 预算是快速失败界限。step 预算合计 163m（33 个 step：3m checkout
    # + 32 × 5m；2026-08-25 按逐 step 上限求和），且仅为逐 step 上限。合计超过 job
    # 预算对层级 B 是正确的，也不是 scripts/lib/CiWorkflowBudgets.ps1 执行的约束：
    # “step 预算合计低于 job 预算”不变量只适用于层级 A，即会从
    # `if: always()` step 发布证据、而该 step 会被 job 级超时取消的 job。本 job 没有
    # 此类 step，因此门禁从不读取这个数字——新增 step 时须人工保持其准确。
    # 该合计只保留一个当前值：增删 step 直接改这个数字，不要追加历史增量句。
    # 判据不变：新增 step 若本地均在秒级完成，job 预算保持 10m
    # （MAN-669 PR-C 的两个 solution-configuration-membership step、#1509 的扫描
    # 边界契约 step、#1512 的两个 ordinal 合同 step、#1826 的跨域对账契约 step、
    # #1876 的信号退出码契约 step、#1877 的 FullChain 内存证据契约 step、#1887 的 ADR
    # 生命周期禁令契约 step（本机 4.3s）均按此判断）。
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: impact-plan
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' || needs.impact-plan.result != 'success' || needs.impact-plan.outputs.scripts != 'false' || needs.impact-plan.outputs.backend != 'false' || needs.impact-plan.outputs.frontend != 'false' || needs.impact-plan.outputs.connector_hosts != 'false' || needs.impact-plan.outputs.infra != 'false') }}
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run script governance check
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/check-script-governance.ps1

      - name: Test source size governance
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/source-size-governance.Tests.ps1

      - name: Run source size governance check
        timeout-minutes: 5
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/check-source-size-governance.ps1 -BaseCommit $env:BASE_SHA

      - name: Run production deployment input contract tests
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/production-deployment-inputs.Tests.ps1

      - name: Verify ADR format
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/verify-adr-format.ps1

      # #1887：`日期戳增量段落` 与 `实施状态与票映射` 两档欠账刚清零，清完没有防复发门禁——按仓库
      # 既有教训（同一红门在 #1508 里重生三次）它会回来。这一步守的是那条禁令本身的鉴别力：
      # 禁令加上去时对 27 篇 ADR 零命中，「跑一遍 docs/adr 是绿的」什么都不证明，所以测试自带
      # 变异矩阵，并把治理文档的禁用标题表与脚本里的三个列表双向锁定。
      - name: Test ADR lifecycle section governance
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/verify-adr-format-lifecycle.Tests.ps1

      - name: Verify CI required summary
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/verify-ci-required-summary.ps1

      - name: Test CI required summary
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/ci-required-summary.Tests.ps1

      - name: Test CI impact plan
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/ci-impact-plan.Tests.ps1

      - name: Test acceptance scenario matrix contract
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/acceptance-scenario-matrix.Tests.ps1

      - name: Test acceptance scenario matrix runtime contract
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/acceptance-scenario-matrix-runtime.Tests.ps1

      - name: Test acceptance scenario matrix equivalence contract
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/acceptance-scenario-matrix-equivalence.Tests.ps1

      - name: Test PostgreSQL lane contract
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/postgres-test-lane.Tests.ps1

      - name: Test Redis/CAP lane contract
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/redis-cap-test-lane.Tests.ps1

      - name: Test FullChain lane contract
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/full-chain-test-lane.Tests.ps1

      - name: Test frontend workspace plan
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/frontend-workspace-plan.Tests.ps1

      - name: Test nightly business performance workflow
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/nightly-business-performance-workflow.Tests.ps1

      - name: Test business performance metric completeness
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/business-performance-metrics-completeness.Tests.ps1

      - name: Test ordinal string primitives
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/ordinal-string.Tests.ps1

      # 纯 fixture 契约：只跑 scripts/lib/WorldHistoryCrossDomain.ps1 的对账函数，不连库、不起进程。
      # verify-world-history.ps1 本身按 #1826 的裁决不上门禁；上门禁的只有这份鉴别力测试，
      # 否则对账器少查一类行、放宽一个量级都不会有人发现。
      - name: Test world-history cross-domain reconciliation contract
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/world-history-cross-domain.Tests.ps1

      # #1664：FullChain 的 man-440 两次被内核 SIGKILL（内层 137），而 lane 只报 `exited with 1`，
      # 结果被当成场景断言失败或抖动。这一步守的是「信号死亡在它经过的每一层都自报家门」，包括
      # 跨进程继承那一跳——它正是当时唯一断掉的一环。测试自带变异对照，拿掉分类后必须转红。
      - name: Test script automation signal exit classification
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/script-automation-signal-exit.Tests.ps1

      # #1664：man-440 的 137 被归因为 OOM，但诊断包里从来没有内存维度证据，结论一直是推断。这一步
      # 守的是那条证据本身——精确解析 + best-effort 降级（采证绝不把被测 lane 弄红），并用 AST 断言
      # 快照落在 entrypoint 前后而不是 lane 首尾。测试自带变异对照。
      - name: Test FullChain memory evidence contract
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/full-chain-memory-evidence.Tests.ps1

      # The checker above only reports on the files it decides to scan; this step is what holds that
      # decision still. #1509 narrowed the exclusion list to three entries and put scripts/lib under
      # a declared library scope, and a boundary nobody re-checks drifts back — so the exclusion list
      # and the library rule set are asserted here, in CI, not only in the local gate. Deliberately
      # split out of scripts/tests/check-script-governance.Tests.ps1, which also drives the
      # ScriptAutomation stream-drain and detached-process fixtures; this file is 4.7s of checker
      # runs against small fixtures. Ruling: docs/architecture/script-automation-governance.md.
      - name: Test script governance scan boundary
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/script-governance-scan-boundary.Tests.ps1

      - name: Test ordinal comparison layers
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/ordinal-comparison-layers.Tests.ps1

      - name: Test worktree skill link layer
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/worktree-skill-links.Tests.ps1

      - name: Test backend determinism checker
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/check-backend-test-determinism.Tests.ps1

      - name: Test backend determinism verifier
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/verify-backend-test-determinism.Tests.ps1

      - name: Run backend determinism checker
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/check-backend-test-determinism.ps1

      - name: Run test evidence contract tests
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/test-evidence.Tests.ps1

      - name: Test solution configuration membership checker
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/solution-configuration-membership.Tests.ps1

      - name: Run solution configuration membership check
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/verify-solution-configuration-membership.ps1

  ci-summary:
    name: CI Summary
    timeout-minutes: 5
    runs-on: ubuntu-latest
    if: always()
    needs:
      - impact-plan
      - backend-tests
      - postgres-provider-tests
      - redis-cap-transport-tests
      - business-full-chain-acceptance
      - connector-host-tests
      - frontend-unit-tests
      - frontend
      - openapi-client-drift
      - script-governance
    steps:
      - name: Require all CI lanes
        timeout-minutes: 3
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          impact_result="${{ needs.impact-plan.result }}"
          backend_result="${{ needs.backend-tests.result }}"
          connector_result="${{ needs.connector-host-tests.result }}"
          script_governance_result="${{ needs.script-governance.result }}"
          openapi_result="${{ needs.openapi-client-drift.result }}"
          postgres_result="${{ needs.postgres-provider-tests.result }}"
          redis_cap_result="${{ needs.redis-cap-transport-tests.result }}"
          full_chain_result="${{ needs.business-full-chain-acceptance.result }}"
          backend_selected="${{ github.event_name != 'pull_request' || needs.impact-plan.result != 'success' || needs.impact-plan.outputs.backend != 'false' }}"
          connector_selected="${{ github.event_name != 'pull_request' || needs.impact-plan.result != 'success' || needs.impact-plan.outputs.connector_hosts != 'false' }}"
          script_governance_selected="${{ github.event_name != 'pull_request' || needs.impact-plan.result != 'success' || needs.impact-plan.outputs.scripts != 'false' || needs.impact-plan.outputs.backend != 'false' }}"
          openapi_selected="${{ github.event_name != 'pull_request' || needs.impact-plan.result != 'success' || needs.impact-plan.outputs.openapi_codegen != 'false' }}"
          postgres_selected="${{ github.event_name != 'pull_request' || needs.impact-plan.result != 'success' || needs.impact-plan.outputs.postgresql != 'false' }}"
          redis_cap_selected="${{ github.event_name != 'pull_request' || needs.impact-plan.result != 'success' || needs.impact-plan.outputs.redis_cap != 'false' }}"
          full_chain_selected="${{ github.event_name != 'pull_request' || needs.impact-plan.result != 'success' || needs.impact-plan.outputs.full_chain != 'false' }}"

          if [[ "$backend_selected" = "true" ]]; then
            backend_policy="selected"
          else
            backend_policy="skipped by design"
          fi
          if [[ "$connector_selected" = "true" ]]; then
            connector_policy="selected"
          else
            connector_policy="skipped by design"
          fi
          if [[ "$script_governance_selected" = "true" ]]; then
            script_governance_policy="selected"
          else
            script_governance_policy="skipped by design"
