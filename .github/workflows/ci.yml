name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Timeout policy (MAN-799). Every job declares `timeout-minutes` and every explicit step declares
  # one. Beyond that there are two tiers, because "protect the evidence" only applies where there
  # is evidence to protect:
  #
  #   A) Jobs with `if: always()` evidence steps — backend-tests, erp-sales-order-demand-acceptance,
  #      connector-host-tests:
  #          sum(step timeout-minutes) < job timeout-minutes.
  #      A job-level timeout cancels the *whole* job, `if: always()` steps included, and would take
  #      the MAN-661 test-evidence artifacts down with it; a step-level timeout fails only that
  #      step, so the job continues into `Collect …` / `Upload …`. The strict inequality is what
  #      guarantees some step budget fires first. It holds only if *every* explicit step has a
  #      budget, evidence collection/upload included. The remaining margin (job − sum) must also
  #      absorb GitHub's implicit `Set up job` and post steps, which are not in `steps:` and cannot
  #      carry `timeout-minutes`; the post steps run *after* Upload, so they can cost budget but
  #      never cost evidence. Adding a step here means adding its budget *and* raising the job
  #      budget.
  #
  #   B) Jobs with no `if: always()` step — frontend, openapi-client-drift, script-governance:
  #      nothing is lost when the job budget fires, so the budget is *not* inflated to clear the
  #      step sum. It is sized from observed runtime and only has to stay above the largest single
  #      step budget so step budgets stay reachable as the fail-fast bound.
  #
  # Step budgets are generous round upper bounds, not a uniform multiple: long steps are ~2x their
  # observed maximum over the last 9 runs, while short fixed-cost steps (checkout, SDK/pnpm setup,
  # cache restore) get a 3–8 minute floor that no healthy run comes near.
  #
  # Enforced by scripts/tests/test-evidence.Tests.ps1 (run by the Script Governance job below).
  # Narrative copy of this rule: docs/architecture/test-evidence-governance.md.
  backend-tests:
    name: Backend Tests
    # Tier A (evidence steps). Observed max 23.9m / avg 17.9m. Step budgets sum to 69m,
    # leaving 6m of margin for the implicit setup/post steps.
    timeout-minutes: 75
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        timeout-minutes: 8
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props', 'connector-hosts/**/*.csproj', 'connector-hosts/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve test evidence environment
        id: backend-evidence-environment
        timeout-minutes: 3
        shell: pwsh
        run: |
          $testedSha = (git rev-parse HEAD).Trim()
          "runner-image=$env:ImageOS@$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "dotnet-sdk=$(dotnet --version)" >> $env:GITHUB_OUTPUT
          "tested-sha=$testedSha" >> $env:GITHUB_OUTPUT
          Write-Host "tested-sha=$testedSha"

      - name: Test backend solution
        id: backend-tests
        # Smaller than the job budget so the evidence steps below still run on a hang.
        timeout-minutes: 40
        run: >-
          dotnet test backend/Nerv.IIP.sln
          --configuration Release
          --logger trx
          --results-directory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend

      - name: Collect backend test evidence
        id: collect-backend-evidence
        if: always()
        timeout-minutes: 5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: >-
          ./scripts/collect-test-evidence.ps1
          -Lane backend
          -SelectedLanes backend
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend
          -OutputDirectory artifacts/test-evidence/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend
          -WorkflowRunId ${{ github.run_id }}
          -RunAttempt ${{ github.run_attempt }}
          -HeadSha ${{ github.event.pull_request.head.sha || github.sha }}
          -TestedSha ${{ steps.backend-evidence-environment.outputs.tested-sha }}
          -RunnerOs ${{ runner.os }}
          -Repository ${{ github.repository }}
          -JobName "Backend Tests"
          -CurrentTestOutcome ${{ steps.backend-tests.outcome }}
          -Event ${{ github.event_name }}
          -HeadBranch $env:HEAD_BRANCH
          -SourceUrl ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          -RunnerImage ${{ steps.backend-evidence-environment.outputs.runner-image }}
          -DotnetSdk ${{ steps.backend-evidence-environment.outputs.dotnet-sdk }}
          -ArtifactName test-evidence-backend-${{ github.run_id }}-${{ github.run_attempt }}
          -RetentionDays 14
          -StepSummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Upload backend test evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect-backend-evidence.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 14

  erp-sales-order-demand-acceptance:
    name: ERP Sales Order Demand Acceptance
    # Tier A (evidence steps). Observed max 4.2m / avg 3.9m; extra headroom for Docker image
    # pulls. Step budgets sum to 46m, leaving 9m of margin for the implicit setup/post steps.
    timeout-minutes: 55
    runs-on: ubuntu-latest
    env:
      NERV_IIP_TEST_POSTGRES: Host=127.0.0.1;Port=15432;Database=nerv_iip;Username=nerv;Password=nerv
      NERV_IIP_TEST_REDIS: 127.0.0.1:6379
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        timeout-minutes: 8
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Prepare PostgreSQL and Redis images
        timeout-minutes: 10
        run: |
          docker pull postgres:18
          docker pull redis:8

      - name: Verify ERP sales-order demand bridge
        shell: pwsh
        # Smaller than the job budget so the diagnostics upload below still runs on a hang.
        timeout-minutes: 15
        run: ./scripts/verify-erp-sales-order-demand-planning.ps1

      - name: Upload ERP sales-order demand diagnostics
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: erp-sales-order-demand-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/acceptance/man517
            artifacts/script-logs/man517-*
          if-no-files-found: warn
          retention-days: 7

  connector-host-tests:
    name: Connector Host Tests
    # Tier A (evidence steps). Observed max 1.9m / avg 1.6m. This is the job that hung for 28m
    # in MAN-799. Step budgets sum to 41m, leaving 9m of margin for the implicit setup/post steps.
    timeout-minutes: 50
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        timeout-minutes: 8
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props', 'connector-hosts/**/*.csproj', 'connector-hosts/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve test evidence environment
        id: connector-evidence-environment
        timeout-minutes: 3
        shell: pwsh
        run: |
          $testedSha = (git rev-parse HEAD).Trim()
          "runner-image=$env:ImageOS@$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "dotnet-sdk=$(dotnet --version)" >> $env:GITHUB_OUTPUT
          "tested-sha=$testedSha" >> $env:GITHUB_OUTPUT
          Write-Host "tested-sha=$testedSha"

      - name: Test connector host solution
        id: connector-host-tests
        # Smaller than the job budget so the evidence steps below still run on a hang.
        timeout-minutes: 12
        run: >-
          dotnet test connector-hosts/Nerv.IIP.ConnectorHost.sln
          --configuration Release
          --logger trx
          --results-directory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/connector-host

      - name: Collect connector host test evidence
        id: collect-connector-host-evidence
        if: always()
        timeout-minutes: 5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: >-
          ./scripts/collect-test-evidence.ps1
          -Lane connector-host
          -SelectedLanes connector-host
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/connector-host
          -OutputDirectory artifacts/test-evidence/${{ github.run_id }}/attempt-${{ github.run_attempt }}/connector-host
          -WorkflowRunId ${{ github.run_id }}
          -RunAttempt ${{ github.run_attempt }}
          -HeadSha ${{ github.event.pull_request.head.sha || github.sha }}
          -TestedSha ${{ steps.connector-evidence-environment.outputs.tested-sha }}
          -RunnerOs ${{ runner.os }}
          -Repository ${{ github.repository }}
          -JobName "Connector Host Tests"
          -CurrentTestOutcome ${{ steps.connector-host-tests.outcome }}
          -Event ${{ github.event_name }}
          -HeadBranch $env:HEAD_BRANCH
          -SourceUrl ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          -RunnerImage ${{ steps.connector-evidence-environment.outputs.runner-image }}
          -DotnetSdk ${{ steps.connector-evidence-environment.outputs.dotnet-sdk }}
          -ArtifactName test-evidence-connector-host-${{ github.run_id }}-${{ github.run_attempt }}
          -RetentionDays 14
          -StepSummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Upload connector host test evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-connector-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect-connector-host-evidence.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend Typecheck and Build
    # Tier B (no evidence steps). Observed max 5.0m / avg 4.4m; largest step budget 15m.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        timeout-minutes: 12
        run: pnpm -C frontend install --frozen-lockfile

      - name: Check frontend format and lint
        timeout-minutes: 10
        run: pnpm -C frontend check

      - name: Typecheck frontend
        timeout-minutes: 10
        run: pnpm -C frontend typecheck

      - name: Build frontend
        timeout-minutes: 15
        run: pnpm -C frontend build

  openapi-client-drift:
    name: OpenAPI/api-client Drift
    # Tier B (no evidence steps). Observed max 2.2m / avg 1.9m; largest step budget 15m.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        timeout-minutes: 8
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Verify OpenAPI/api-client drift
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/verify-openapi-client-drift.ps1

  script-governance:
    name: Script Governance
    # Tier B (no evidence steps). Observed max 1.8m / avg 0.7m; largest step budget 5m.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run script governance check
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/check-script-governance.ps1

      - name: Test backend determinism checker
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/check-backend-test-determinism.Tests.ps1

      - name: Test backend determinism verifier
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/verify-backend-test-determinism.Tests.ps1

      - name: Run backend determinism checker
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/check-backend-test-determinism.ps1

      - name: Run test evidence contract tests
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/test-evidence.Tests.ps1
