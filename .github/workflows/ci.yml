name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 超时策略（MAN-799，针对 MAN-669 分片拓扑重新推导）。每个 job 均声明
  # `timeout-minutes`，每个显式 step 也均声明一项。除此以外分为两个层级，因为
  # “保护证据”仅适用于存在可保护证据之处：
  #
  #   A) 带 `if: always()` 证据 step 的 job——四个 backend 分片，以及
  #      erp-sales-order-demand-acceptance 和 connector-host-tests：
  #          sum(step timeout-minutes) < job timeout-minutes.
  #      job 级超时会取消*整个* job，包括 `if: always()` step，并会一并中断
  #      MAN-661 test-evidence 产物；step 级超时只会使该 step 失败，因此 job 会继续进入
  #      `Collect …` / `Upload …`。严格不等式保证某个 step 预算先触发。仅当*每个*显式 step
  #      都有预算（包括证据收集/上传）时，它才成立。剩余余量（job − sum）还必须
  #      吸收 GitHub 隐式的 `Set up job` 和 post step；它们不在 `steps:` 中，且不能
  #      设置 `timeout-minutes`；post step 在 Upload *之后*执行，因此会消耗预算却
  #      永不损失证据。在此新增 step 就意味着增加其预算*并且*提高 job 预算。
  #      以下每个分片 job 正是因此保留 6 分钟余量。
  #
  #   B) 不存在失败后仍可运行 step 的 job——`Backend Tests` 聚合、
  #      backend-test-shard-governance、frontend、openapi-client-drift、script-governance：job
  #      预算触发时不会损失任何内容，因此不为覆盖 step 总和而抬高预算。此处 **job**
  #      预算是按观测运行时长确定的快速失败界限。step 预算仅为逐 step 上限：一个 job 中有
  #      多个 step 时，后续 step 无法分别触达（`frontend` 在 20m job 内合计为 58m，因此其 15m
  #      build 预算无法独立触发），这一点被接受，而非作出相反声明。唯一强制的是在每种调度下
  #      都无法存活的情形——step 预算大于或等于整个 job 预算。
  #
  # 四个 backend 快速分片采用**同一**测试 step 预算，按四者整体的观测最大值约 2 倍确定
  # （而非按分片单独确定）。短时固定成本 step（checkout、SDK setup、cache restore、
  # evidence collect/upload）使用 3–8 分钟的下限，任何健康运行都不会接近它。
  #
  # MAN-669 PR-A 重新归置了分片内容，因此四个分片不再有四种不同形态，也不再采用四种不同预算。
  # 旧的差异（8m / 10m / 15m / 12m）来自重平衡前的拆分：一个分片的 TRX elapsed 为 357s，另一个为 23s；
  # 该拓扑已不复存在，而跨拓扑变更继承的预算不代表任何含义。**每个分片拥有的 project 仅由
  # scripts/backend-test-shards.json 定义**——这些注释有意不重复该内容，因为下次重新平衡分片时，
  # 重述的列表就会漂移。
  #
  # 此次重平衡的一项权重输入并未保留。记录于此以确保下一次不会继承它：business-core-b
  # （backend-shard-4）被赋予最低 TRX 份额，是因为它在重平衡前 run 30999368607 中具有最差的
  # step-to-TRX 比率——265s step 对 191.7s TRX，比率为 1.38，而 business-core-a 为
  # 372s/357.5s = 1.04。该比率描述的 project 集合已不存在：重平衡移出了该分片 9 个 project 中的 7 个，
  # 且 step-minus-TRX 是依赖闭包的 restore/build 成本，它随 project 移动，而不随 lane 标签移动。
  # 重平衡后，在两个分片均产生读数的三次 run（31114441118、31115903098、31118427925）中，
  # business-core-b 是四者中*最快*的分片（144s / 196s / 142s test step），business-core-a 是
  # critical path（249s / 252s / 234s）——该分片被过度减轻，而非被正确减轻。差距位于 runner 方差内，
  # 因此 PR-A 不重新切分；但下一次重平衡（MAN-664）必须根据重平衡后的测量重新推导权重，且绝不
  # 得延续 1.38。
  #
  # 根据本分支三次 run（31114441118、31115903098、31116998822）重新推导。每个分片的 test
  # step 依次为 3.5m / 3.0m / 4.2m / 2.4m，然后为 4.5m / 3.0m / 4.2m / 3.3m，然后为 4.7m / 3.1m /
  # (setup-failed) / 3.1m；TRX elapsed 为 129.8s / 150.6s / 164.5s / 112.9s，然后为 215.5 / 144.5 /
  # 139.6 / 130.2，然后为 177.4 / 133.6 / — / 129.1。可得出两点：相同 commit 上 hosted-runner
  # 方差为数十个百分点，并会改变哪个分片居首，因此逐分片预算只会编码噪声——四者采用同一预算。
  # 该界限按三次 run 中的最大值 4.7m 确定。因此，以下对全部四个分片完全相同：
  #
  #     checkout 3 + setup-dotnet 5 + cache 8 + resolve-evidence 3
  #       + test 10 + collect 5 + upload 5  =  39m step sum  <  45m job budget  (6m margin)
  #
  # 该算术是上述层级 A 的义务；变更任何一个数字都意味着必须重新检查它。
  #
  # 注意共享预算*不*允许做什么。这对全部四个分片同样成立——它们的 step 向量均为
  # 3 / 5 / 8 / 3 / 10 / 5 / 5——因此仅在此处声明，而不在任一 job 中重复：六个非 test step 已携带
  # 强制的 29m shared-convention 预算，因此层级 A 严格的 job > step-sum 要求使 45m 成为该不变量
  # 留下的结构下限，而非对任一分片运行时的声明。挂起 run 实际触发的是 10m test step 预算。
  # 若其接近 10m，必须同时提高两项预算，而非仅提高 step 预算，否则严格不等式将不再保护证据 step。
  #
  # 由 scripts/tests/test-evidence.Tests.ps1 强制执行（由下方 Script Governance job 运行）。
  # 此规则的叙述性副本：docs/architecture/test-evidence-governance.md。
  #
  # ---------------------------------------------------------------------------------------------
  # 构建策略（MAN-669 PR-B / PR-C）。该主题与上述超时策略分离；两个 PR 均未改变预算，因此此处任何内容
  # 均不参与 Test-NervCiWorkflowBudgets 强制的算术。仅保留结论——全部测量、run id、样本限制和重新开启条件
  # 均集中在一处：docs/architecture/backend-ci-build-strategy.md。不得在此重述数字：MAN-664 将重新测量，
  # 而复制到四个文件中的数字会在其中三个中漂移。
  #
  #   * 每个分片保持只 restore 和 build 自己的 .slnf。build-once（一个向分片提供预构建输出的串行 build job）
  #     已在四次 hosted-runner run（两次热、两次冷）中测量，且在两种核算口径下均更慢——单独的全 solution build
  #     已比任一单分片自身的 restore+build 更耗时，因此即使尚未在 job 间移动数 GB 输出，将它抬到 critical path
  #     也会失败。将一个分片拆分为 restore / build --no-restore / test 也更慢。
  #   * 对三个专业 job（erp-sales-order-demand-acceptance、connector-host-tests、
  #     openapi-client-drift）就同一重复问题做过清点，且其 build 命令均未改变：它们均不 build 整个 solution，
  #     且三者均远低于 critical path，因此将其 build 时间降为零也不会缩短 CI wall clock。
  #
  # 仅在该文档列出的可执行条件出现时重新开启任一决定（最慢分片的 build 接近 whole-solution build、
  # runner 规格变化、artifact-transfer 提升一个数量级、总 test 时间再次大幅下降，或专业 job 到达 critical path）——
  # 并重新测量而非推理。否则引用该文档。
  #
  # 一项无论如何均不得重新推导的定义：“critical path”指 run 中最大的 job，而不是最慢的分片。
  # 二者已不再相同——一个 frontend job 已超过最慢分片——因此按“最慢分片”估算任何内容都会低估
  # run 的 wall clock。
  # 所有显式 step 的预算共同构成证据保护的前提。
  # 只有在预算总和严格小于 job 预算时，才会先触发 step 预算。
  # 该余量还覆盖未列于 `steps:` 的隐式 setup 与 post step。
  # 后者位于 Upload 之后，因此消耗预算但不会损失已收集证据。
  # 无失败后 step 的 job 则将 job 预算用作快速失败界限。
  # 这些 job 的后续 step 不会各自获得可达的完整预算。
  # 四个 backend 分片共享预算，以避免将 runner 方差编码为配置。
  # 分片 project 归属始终以 scripts/backend-test-shards.json 为准。
  # 重平衡后的权重必须基于新拓扑的测量重新推导。
  # 旧拓扑的 step-to-TRX 比率不得迁移到新拓扑。
  # 三次 run 的最大 test step 为 4.7m。
  # 39m step 总和与 45m job 预算间保留 6m 余量。
  # 挂起时实际触发的是 10m test step 预算。
  # 任何预算调整均须同步重新检查该严格不等式。
  # 构建策略的测量与重新开启条件集中维护在指定架构文档中。
  # “critical path”始终指整个 run 中最大的 job。
  backend-tests:
    name: Backend Tests
    # 层级 B。纯聚合：针对 needs 结果进行五次 `test` 比较，观测约为 ~2s。
    timeout-minutes: 5
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-test-shard-governance
      - backend-tests-business-gateway
      - backend-tests-platform
      - backend-tests-business-core-a
      - backend-tests-business-core-b
    steps:
      - name: Require all backend fast shards
        timeout-minutes: 3
        run: |
          test "${{ needs.backend-test-shard-governance.result }}" = "success"
          test "${{ needs.backend-tests-business-gateway.result }}" = "success"
          test "${{ needs.backend-tests-platform.result }}" = "success"
          test "${{ needs.backend-tests-business-core-a.result }}" = "success"
          test "${{ needs.backend-tests-business-core-b.result }}" = "success"

  backend-test-shard-governance:
    name: Backend Test Shard Governance
    # 层级 B（失败后没有 step 继续运行）。只读 manifest + 结构化 `ci.yml` 验证，
    # 观测最大值为 0.8m。15m job 预算是快速失败界限；step 预算合计为 18m，
    # 且仅为逐 step 上限。
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup Ruby for structured workflow validation
        timeout-minutes: 5
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      # 每个 step 一个 script，不在单个 `run:` 块中串联：两个 script 都将 findings 输出到 stdout
      # 并以 1 退出；串联会让第二个 script 的 `$LASTEXITCODE` 覆盖第一个，从而将真实失败变绿
      # （已测量）。原因：
      # docs/architecture/backend-ci-build-strategy.md ("走查收尾" 第 3 条).
      - name: Validate backend test shard classification
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/verify-backend-test-shards.ps1

      - name: Test backend test shard governance
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tests/backend-test-shards.Tests.ps1

  backend-tests-business-gateway:
    name: Backend Tests - BusinessGateway
    # 层级 A；共享分片预算为 39m < 45m，仅在 `jobs:` 顶部的超时策略中推导一次。由于 MAN-661 在
    # scripts/lib/TestEvidence.ps1 中将证据 lane backend-shard-1 映射到它，job 名称已冻结——该名称
    # 标识 lane，而不标识仅存在于 scripts/backend-test-shards.json 中的分片内容。
    # 该分片的 project 归属仅由该清单定义。
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        timeout-minutes: 8
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props', 'connector-hosts/**/*.csproj', 'connector-hosts/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve test evidence environment
        timeout-minutes: 3
        id: shard-evidence-environment
        shell: pwsh
        run: |
          $testedSha = (git rev-parse HEAD).Trim()
          "runner-image=$env:ImageOS@$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "dotnet-sdk=$(dotnet --version)" >> $env:GITHUB_OUTPUT
          "tested-sha=$testedSha" >> $env:GITHUB_OUTPUT
          Write-Host "tested-sha=$testedSha"

      - name: Test BusinessGateway shard
        timeout-minutes: 10
        id: shard-tests
        shell: pwsh
        run: >-
          ./scripts/run-backend-test-shard.ps1
          -ShardId business-gateway
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-1
          -TrxFilePrefix backend-tests-business-gateway

      - name: Collect BusinessGateway shard evidence
        timeout-minutes: 5
        id: collect-shard-evidence
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: >-
          ./scripts/collect-test-evidence.ps1
          -Lane backend-shard-1
          -SelectedLanes backend-shard-1
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-1
          -OutputDirectory artifacts/test-evidence/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-1
          -WorkflowRunId ${{ github.run_id }}
          -RunAttempt ${{ github.run_attempt }}
          -HeadSha ${{ github.event.pull_request.head.sha || github.sha }}
          -TestedSha ${{ steps.shard-evidence-environment.outputs.tested-sha }}
          -RunnerOs ${{ runner.os }}
          -Repository ${{ github.repository }}
          -JobName "Backend Tests - BusinessGateway"
          -CurrentTestOutcome ${{ steps.shard-tests.outcome }}
          -Event ${{ github.event_name }}
          -HeadBranch $env:HEAD_BRANCH
          -SourceUrl ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          -RunnerImage ${{ steps.shard-evidence-environment.outputs.runner-image }}
          -DotnetSdk ${{ steps.shard-evidence-environment.outputs.dotnet-sdk }}
          -ArtifactName test-evidence-backend-shard-1-${{ github.run_id }}-${{ github.run_attempt }}
          -RetentionDays 14
          -StepSummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Upload BusinessGateway shard evidence
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-backend-shard-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect-shard-evidence.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 14

  backend-tests-platform:
    name: Backend Tests - Platform
    # 层级 A；共享分片预算为 39m < 45m，仅在 `jobs:` 顶部的超时策略中推导一次。
    # job 名称已冻结：MAN-661 将证据 lane backend-shard-2 映射到它。
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        timeout-minutes: 8
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props', 'connector-hosts/**/*.csproj', 'connector-hosts/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve test evidence environment
        timeout-minutes: 3
        id: shard-evidence-environment
        shell: pwsh
        run: |
          $testedSha = (git rev-parse HEAD).Trim()
          "runner-image=$env:ImageOS@$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "dotnet-sdk=$(dotnet --version)" >> $env:GITHUB_OUTPUT
          "tested-sha=$testedSha" >> $env:GITHUB_OUTPUT
          Write-Host "tested-sha=$testedSha"

      - name: Test platform shard
        timeout-minutes: 10
        id: shard-tests
        shell: pwsh
        run: >-
          ./scripts/run-backend-test-shard.ps1
          -ShardId platform
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-2
          -TrxFilePrefix backend-tests-platform

      - name: Collect platform shard evidence
        timeout-minutes: 5
        id: collect-shard-evidence
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: >-
          ./scripts/collect-test-evidence.ps1
          -Lane backend-shard-2
          -SelectedLanes backend-shard-2
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-2
          -OutputDirectory artifacts/test-evidence/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-2
          -WorkflowRunId ${{ github.run_id }}
          -RunAttempt ${{ github.run_attempt }}
          -HeadSha ${{ github.event.pull_request.head.sha || github.sha }}
          -TestedSha ${{ steps.shard-evidence-environment.outputs.tested-sha }}
          -RunnerOs ${{ runner.os }}
          -Repository ${{ github.repository }}
          -JobName "Backend Tests - Platform"
          -CurrentTestOutcome ${{ steps.shard-tests.outcome }}
          -Event ${{ github.event_name }}
          -HeadBranch $env:HEAD_BRANCH
          -SourceUrl ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          -RunnerImage ${{ steps.shard-evidence-environment.outputs.runner-image }}
          -DotnetSdk ${{ steps.shard-evidence-environment.outputs.dotnet-sdk }}
          -ArtifactName test-evidence-backend-shard-2-${{ github.run_id }}-${{ github.run_attempt }}
          -RetentionDays 14
          -StepSummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Upload platform shard evidence
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-backend-shard-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect-shard-evidence.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 14

  backend-tests-business-core-a:
    name: Backend Tests - Business Core A
    # 层级 A；共享分片预算为 39m < 45m，仅在 `jobs:` 顶部的超时策略中推导一次。
    # job 名称已冻结：MAN-661 将证据 lane backend-shard-3 映射到它。
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        timeout-minutes: 8
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props', 'connector-hosts/**/*.csproj', 'connector-hosts/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve test evidence environment
        timeout-minutes: 3
        id: shard-evidence-environment
        shell: pwsh
        run: |
          $testedSha = (git rev-parse HEAD).Trim()
          "runner-image=$env:ImageOS@$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "dotnet-sdk=$(dotnet --version)" >> $env:GITHUB_OUTPUT
          "tested-sha=$testedSha" >> $env:GITHUB_OUTPUT
          Write-Host "tested-sha=$testedSha"

      - name: Test business core A shard
        timeout-minutes: 10
        id: shard-tests
        shell: pwsh
        run: >-
          ./scripts/run-backend-test-shard.ps1
          -ShardId business-core-a
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-3
          -TrxFilePrefix backend-tests-business-core-a

      - name: Collect business core A shard evidence
        timeout-minutes: 5
        id: collect-shard-evidence
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: >-
          ./scripts/collect-test-evidence.ps1
          -Lane backend-shard-3
          -SelectedLanes backend-shard-3
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-3
