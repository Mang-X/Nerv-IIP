  erp-sales-order-demand-acceptance:
    name: ERP Sales Order Demand Acceptance
    # Tier A (evidence steps). Observed max 4.2m / avg 3.9m; extra headroom for Docker image
    # pulls. Step budgets sum to 46m, leaving 9m of margin for the implicit setup/post steps.
    timeout-minutes: 55
    runs-on: ubuntu-latest
    env:
      NERV_IIP_TEST_POSTGRES: Host=127.0.0.1;Port=15432;Database=nerv_iip;Username=nerv;Password=nerv
      NERV_IIP_TEST_REDIS: 127.0.0.1:6379
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        timeout-minutes: 8
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Prepare PostgreSQL and Redis images
        timeout-minutes: 10
        run: |
          docker pull postgres:18
          docker pull redis:8

      - name: Verify ERP sales-order demand bridge
        timeout-minutes: 15
        shell: pwsh
        run: ./scripts/verify-erp-sales-order-demand-planning.ps1

      - name: Upload ERP sales-order demand diagnostics
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erp-sales-order-demand-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/acceptance/man517
            artifacts/script-logs/man517-*
          if-no-files-found: warn
          retention-days: 7

  connector-host-tests:
    name: Connector Host Tests
    # Tier A (evidence steps). Observed max 1.9m / avg 1.6m. This is the job that hung for 28m
    # in MAN-799. Step budgets sum to 41m, leaving 9m of margin for the implicit setup/post steps.
    timeout-minutes: 50
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
