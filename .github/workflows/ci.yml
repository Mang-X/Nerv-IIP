  postgres-provider-tests:
    name: PostgreSQL Provider Tests
    # NERV-688 拆解②：Inventory 单服务试点。层级 A；显式 step 预算合计 59m，
    # 小于 66m job 预算，为 service setup 和 action post steps 保留 7m。
    timeout-minutes: 66
    runs-on: ubuntu-latest
    needs: impact-plan
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' || needs.impact-plan.result != 'success' || needs.impact-plan.outputs.postgresql != 'false') }}
    env:
      NERV_IIP_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=nerv;Password=nerv
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nerv
          POSTGRES_PASSWORD: nerv
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nerv -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        timeout-minutes: 8
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install PostgreSQL client
        timeout-minutes: 5
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Resolve PostgreSQL evidence environment
        timeout-minutes: 3
        id: postgres-evidence-environment
        shell: pwsh
        run: |
          $testedSha = (git rev-parse HEAD).Trim()
          "runner-image=$env:ImageOS@$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "dotnet-sdk=$(dotnet --version)" >> $env:GITHUB_OUTPUT
          "tested-sha=$testedSha" >> $env:GITHUB_OUTPUT
          Write-Host "tested-sha=$testedSha"

      - name: Run Inventory PostgreSQL profile pilot
        timeout-minutes: 20
        id: postgres-tests
        shell: pwsh
        run: >-
          ./scripts/run-postgres-test-lane.ps1
          -MemberId inventory-postgres-profile
          -DatabaseName nerv_iip_inventory_${{ github.run_id }}_${{ github.run_attempt }}
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/postgres
          -SummaryPath artifacts/postgres-test-lane/${{ github.run_id }}/attempt-${{ github.run_attempt }}/summary.json

      - name: Collect PostgreSQL pilot evidence
        timeout-minutes: 5
        id: collect-postgres-evidence
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: >-
          ./scripts/collect-test-evidence.ps1
          -Lane postgres
          -SelectedLanes postgres
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/postgres
          -OutputDirectory artifacts/test-evidence/${{ github.run_id }}/attempt-${{ github.run_attempt }}/postgres
          -WorkflowRunId ${{ github.run_id }}
          -RunAttempt ${{ github.run_attempt }}
          -HeadSha ${{ github.event.pull_request.head.sha || github.sha }}
          -TestedSha ${{ steps.postgres-evidence-environment.outputs.tested-sha }}
          -RunnerOs ${{ runner.os }}
          -Repository ${{ github.repository }}
          -JobName "PostgreSQL Provider Tests"
          -CurrentTestOutcome ${{ steps.postgres-tests.outcome }}
          -Event ${{ github.event_name }}
          -HeadBranch $env:HEAD_BRANCH
          -SourceUrl ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          -RunnerImage ${{ steps.postgres-evidence-environment.outputs.runner-image }}
          -DotnetSdk ${{ steps.postgres-evidence-environment.outputs.dotnet-sdk }}
          -ArtifactName test-evidence-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          -RetentionDays 14
          -StepSummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Upload PostgreSQL normalized evidence
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect-postgres-evidence.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload PostgreSQL dependency summary
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-dependency-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/postgres-test-lane/${{ github.run_id }}/attempt-${{ github.run_attempt }}/summary.json
          if-no-files-found: error
          retention-days: 14

