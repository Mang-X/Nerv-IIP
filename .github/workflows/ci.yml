          -RunnerImage ${{ steps.shard-evidence-environment.outputs.runner-image }}
          -DotnetSdk ${{ steps.shard-evidence-environment.outputs.dotnet-sdk }}
          -ArtifactName test-evidence-backend-shard-2-${{ github.run_id }}-${{ github.run_attempt }}
          -RetentionDays 14
          -StepSummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Upload platform shard evidence
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-backend-shard-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect-shard-evidence.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 14

  backend-tests-business-core-a:
    name: Backend Tests - Business Core A
    # Tier A (evidence steps). The job name is frozen (MAN-661 maps evidence lane backend-shard-3 to
    # it); MAN-669 PR-A moved WMS, ERP and MasterData out and Quality plus the acceptance suite in.
    # Measured on run 31114441118: 164.5s of TRX elapsed, 4.2m test step, 4.6m job — the largest of
    # the four and therefore the shard the shared 9m budget is sized on, against 6.2m/6.9m before
    # the rebalance. Step budgets sum to 38m, leaving 6m of margin for the implicit setup/post
    # steps.
    timeout-minutes: 44
    runs-on: ubuntu-latest
    steps:
