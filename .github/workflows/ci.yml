          "tested-sha=$testedSha" >> $env:GITHUB_OUTPUT
          Write-Host "tested-sha=$testedSha"

      - name: Test platform shard
        timeout-minutes: 9
        id: shard-tests
        shell: pwsh
        run: >-
          ./scripts/run-backend-test-shard.ps1
          -ShardId platform
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-2
          -TrxFilePrefix backend-tests-platform

      - name: Collect platform shard evidence
        timeout-minutes: 5
        id: collect-shard-evidence
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: >-
          ./scripts/collect-test-evidence.ps1
          -Lane backend-shard-2
          -SelectedLanes backend-shard-2
          -ResultsDirectory artifacts/test-evidence-raw/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-2
          -OutputDirectory artifacts/test-evidence/${{ github.run_id }}/attempt-${{ github.run_attempt }}/backend-shard-2
          -WorkflowRunId ${{ github.run_id }}
          -RunAttempt ${{ github.run_attempt }}
          -HeadSha ${{ github.event.pull_request.head.sha || github.sha }}
          -TestedSha ${{ steps.shard-evidence-environment.outputs.tested-sha }}
          -RunnerOs ${{ runner.os }}
          -Repository ${{ github.repository }}
          -JobName "Backend Tests - Platform"
          -CurrentTestOutcome ${{ steps.shard-tests.outcome }}
          -Event ${{ github.event_name }}
          -HeadBranch $env:HEAD_BRANCH
