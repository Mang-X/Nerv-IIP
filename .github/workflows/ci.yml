name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-test-shard-governance
      - backend-tests-business-gateway
      - backend-tests-platform
      - backend-tests-business-core-a
      - backend-tests-business-core-b
    steps:
      - name: Require all backend fast shards
        run: |
          test "${{ needs.backend-test-shard-governance.result }}" = "success"
          test "${{ needs.backend-tests-business-gateway.result }}" = "success"
          test "${{ needs.backend-tests-platform.result }}" = "success"
          test "${{ needs.backend-tests-business-core-a.result }}" = "success"
          test "${{ needs.backend-tests-business-core-b.result }}" = "success"

  backend-test-shard-governance:
    name: Backend Test Shard Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate backend test shard classification
        shell: pwsh
        run: |
          ./scripts/verify-backend-test-shards.ps1
          ./scripts/tests/backend-test-shards.Tests.ps1

  backend-tests-business-gateway:
    name: Backend Tests - BusinessGateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props', 'connector-hosts/**/*.csproj', 'connector-hosts/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Test BusinessGateway shard
        run: |
          mkdir -p TestResults/backend-tests-business-gateway
          set -o pipefail
          dotnet test backend/ci/backend-tests-business-gateway.slnf --configuration Release --logger "trx;LogFileName=backend-tests-business-gateway.trx" --results-directory TestResults/backend-tests-business-gateway 2>&1 | tee TestResults/backend-tests-business-gateway/backend-tests-business-gateway.log

      - name: Upload BusinessGateway shard diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-business-gateway-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/backend-tests-business-gateway
          if-no-files-found: warn
          retention-days: 7

  backend-tests-platform:
    name: Backend Tests - Platform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props', 'connector-hosts/**/*.csproj', 'connector-hosts/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Test platform shard
        run: |
          mkdir -p TestResults/backend-tests-platform
          set -o pipefail
          dotnet test backend/ci/backend-tests-platform.slnf --configuration Release --logger "trx;LogFileName=backend-tests-platform.trx" --results-directory TestResults/backend-tests-platform 2>&1 | tee TestResults/backend-tests-platform/backend-tests-platform.log

      - name: Upload platform shard diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-platform-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/backend-tests-platform
          if-no-files-found: warn
          retention-days: 7

  backend-tests-business-core-a:
    name: Backend Tests - Business Core A
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props', 'connector-hosts/**/*.csproj', 'connector-hosts/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Test business core A shard
        run: |
          mkdir -p TestResults/backend-tests-business-core-a
          set -o pipefail
          dotnet test backend/ci/backend-tests-business-core-a.slnf --configuration Release --logger "trx;LogFileName=backend-tests-business-core-a.trx" --results-directory TestResults/backend-tests-business-core-a 2>&1 | tee TestResults/backend-tests-business-core-a/backend-tests-business-core-a.log

      - name: Upload business core A shard diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-business-core-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/backend-tests-business-core-a
          if-no-files-found: warn
          retention-days: 7

  backend-tests-business-core-b:
    name: Backend Tests - Business Core B
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props', 'connector-hosts/**/*.csproj', 'connector-hosts/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Test business core B shard
        run: |
          mkdir -p TestResults/backend-tests-business-core-b
          set -o pipefail
          dotnet test backend/ci/backend-tests-business-core-b.slnf --configuration Release --logger "trx;LogFileName=backend-tests-business-core-b.trx" --results-directory TestResults/backend-tests-business-core-b 2>&1 | tee TestResults/backend-tests-business-core-b/backend-tests-business-core-b.log

      - name: Upload business core B shard diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-business-core-b-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/backend-tests-business-core-b
          if-no-files-found: warn
          retention-days: 7

  erp-sales-order-demand-acceptance:
    name: ERP Sales Order Demand Acceptance
    runs-on: ubuntu-latest
    env:
      NERV_IIP_TEST_POSTGRES: Host=127.0.0.1;Port=15432;Database=nerv_iip;Username=nerv;Password=nerv
      NERV_IIP_TEST_REDIS: 127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Prepare PostgreSQL and Redis images
        run: |
          docker pull postgres:18
          docker pull redis:8

      - name: Verify ERP sales-order demand bridge
        shell: pwsh
        run: ./scripts/verify-erp-sales-order-demand-planning.ps1

      - name: Upload ERP sales-order demand diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erp-sales-order-demand-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/acceptance/man517
            artifacts/script-logs/man517-*
          if-no-files-found: warn
          retention-days: 7

  connector-host-tests:
    name: Connector Host Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props', 'connector-hosts/**/*.csproj', 'connector-hosts/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Test connector host solution
        run: dotnet test connector-hosts/Nerv.IIP.ConnectorHost.sln --configuration Release

  frontend:
    name: Frontend Typecheck and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm -C frontend install --frozen-lockfile

      - name: Check frontend format and lint
        run: pnpm -C frontend check

      - name: Typecheck frontend
        run: pnpm -C frontend typecheck

      - name: Build frontend
        run: pnpm -C frontend build

  openapi-client-drift:
    name: OpenAPI/api-client Drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', 'backend/**/*.csproj', 'backend/**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Verify OpenAPI/api-client drift
        shell: pwsh
        run: ./scripts/verify-openapi-client-drift.ps1

  script-governance:
    name: Script Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run script governance check
        shell: pwsh
        run: ./scripts/check-script-governance.ps1
