display_name: Nerv Task Delivery
short_description: Deliver approved GitHub Issues (or uniquely resolved Linear keys) with separate implementation and review seats per pull request.
default_prompt: Resume from approved GitHub specs and child tickets. Deliver one ticket per worktree, branch, and pull request; follow approved blocker edges; keep implementation and review seats separate; verify the whole parent spec once after all child pull requests merge; and perform root-cause attribution every three review rounds, with continued in-scope work as the default.
