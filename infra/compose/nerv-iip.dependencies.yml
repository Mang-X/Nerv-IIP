services:
  postgres:
    image: postgres:19
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NERV_IIP_POSTGRES_USER:-nerv}
      POSTGRES_PASSWORD: ${NERV_IIP_POSTGRES_PASSWORD:?Set NERV_IIP_POSTGRES_PASSWORD}
      POSTGRES_DB: ${NERV_IIP_POSTGRES_DB:-nerv_iip}
    ports:
      - "${NERV_IIP_POSTGRES_PORT:-15432}:5432"
    volumes:
      - nerv-iip-postgres-18:/var/lib/postgresql
      - ../postgres/init-nerv-iip-databases.sql:/docker-entrypoint-initdb.d/20-nerv-iip-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NERV_IIP_POSTGRES_USER:-nerv} -d ${NERV_IIP_POSTGRES_DB:-nerv_iip}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        password="$$(cat /run/secrets/redis_password)"
        test -n "$$password"
        password_hash="$$(printf '%s' "$$password" | sha256sum)"
        printf 'appendonly yes\nsave 60 1\nuser default on #%s ~* &* +@all\n' "$${password_hash%% *}" |
          exec /usr/local/bin/docker-entrypoint.sh redis-server -
    secrets:
      - redis_password
    ports:
      - "${NERV_IIP_REDIS_PORT:-6379}:6379"
    volumes:
      - nerv-iip-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    profiles: ["rabbitmq"]
    ports:
      - "${NERV_IIP_RABBITMQ_PORT:-5672}:5672"
      - "${NERV_IIP_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-04-17T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${NERV_IIP_MINIO_ROOT_USER:?Set NERV_IIP_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${NERV_IIP_MINIO_ROOT_PASSWORD:?Set NERV_IIP_MINIO_ROOT_PASSWORD}
    ports:
      - "${NERV_IIP_MINIO_API_PORT:-9000}:9000"
      - "${NERV_IIP_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - nerv-iip-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: pgsty/minio:RELEASE.2026-04-17T00-00-00Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${NERV_IIP_MINIO_ROOT_USER:?Set NERV_IIP_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${NERV_IIP_MINIO_ROOT_PASSWORD:?Set NERV_IIP_MINIO_ROOT_PASSWORD}
      COMPLIANCE_ARCHIVE_BUCKET: nerv-iip-compliance-archive
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set nerv-iip http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null
        mc mb --ignore-existing --with-lock --with-versioning "nerv-iip/$${COMPLIANCE_ARCHIVE_BUCKET}"
        mc version enable "nerv-iip/$${COMPLIANCE_ARCHIVE_BUCKET}"
        version_info="$$(mc version info --json "nerv-iip/$${COMPLIANCE_ARCHIVE_BUCKET}")"
        printf '%s\n' "$${version_info}"
        case "$${version_info}" in
          *'"status":"Enabled"'*) ;;
          *) exit 1 ;;
        esac
        retention_info="$$(mc retention info --json --default "nerv-iip/$${COMPLIANCE_ARCHIVE_BUCKET}/")"
        printf '%s\n' "$${retention_info}"
        case "$${retention_info}" in
          *'"enabled":"Enabled"'*) ;;
          *) exit 1 ;;
        esac

  victoria-logs:
    image: victoriametrics/victoria-logs:v1.50.0
    restart: unless-stopped
    command: ["-storageDataPath=/victoria-logs-data", "-retentionPeriod=${NERV_IIP_VICTORIA_LOGS_RETENTION:-30d}"]
    ports:
      - "${NERV_IIP_VICTORIA_LOGS_PORT:-9428}:9428"
    volumes:
      - nerv-iip-victoria-logs:/victoria-logs-data

  otel-collector:
    image: otel/opentelemetry-collector:0.116.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      NERV_IIP_ASPIRE_DASHBOARD_OTLP_HTTP_ENDPOINT: ${NERV_IIP_ASPIRE_DASHBOARD_OTLP_HTTP_ENDPOINT:-http://aspire-dashboard:18890}
      NERV_IIP_VICTORIA_LOGS_OTLP_HTTP_ENDPOINT: ${NERV_IIP_VICTORIA_LOGS_OTLP_HTTP_ENDPOINT:-http://victoria-logs:9428/insert/opentelemetry/v1/logs}
    ports:
      - "${NERV_IIP_OTEL_GRPC_PORT:-4317}:4317"
      - "${NERV_IIP_OTEL_HTTP_PORT:-4318}:4318"
    volumes:
      - ../otel/otel-collector.dev.yaml:/etc/otelcol/config.yaml:ro
      - nerv-iip-otel-queue:/var/lib/otelcol

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:10.0
    restart: unless-stopped
    profiles: ["aspire-dashboard"]
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
      ASPIRE_DASHBOARD_OTLP_HTTP_ENDPOINT_URL: http://0.0.0.0:18890
    ports:
      - "${NERV_IIP_ASPIRE_DASHBOARD_PORT:-18888}:18888"
      - "${NERV_IIP_ASPIRE_DASHBOARD_OTLP_PORT:-18889}:18889"
      - "${NERV_IIP_ASPIRE_DASHBOARD_OTLP_HTTP_PORT:-18890}:18890"

secrets:
  redis_password:
    # 文件只存一行 Redis 密码，须与业务服务连接串使用的密码一致。
    file: ${NERV_IIP_REDIS_PASSWORD_FILE:?Set NERV_IIP_REDIS_PASSWORD_FILE}

volumes:
  nerv-iip-postgres-18:
  nerv-iip-redis:
  nerv-iip-minio:
  nerv-iip-victoria-logs:
  nerv-iip-otel-queue:
