# Project environment shortcuts for Codex.
version = 1
name = "Nerv-IIP"

[setup]
script = '''
set -eu

worktree_root="$CODEX_WORKTREE_PATH"
common_git_dir="$(git -C "$worktree_root" rev-parse --path-format=absolute --git-common-dir)"
main_root="$(dirname "$common_git_dir")"

# 判内容而非存在性：`mkdir -p` 和中途失败的镜像都会留下一个空的 .agents/skills，
# 存在性判定会把它当成「已安装」——此后既不再安装，紧接着的 cp 也搬不出任何东西，
# 该 worktree 一条技能都没有且无一步报错（#3486）。
# stderr 丢弃的是「目录不存在」这一正常起点；真出别的错时 find 无输出 => 判未安装 => 重装一次（吵，不是静默缺失）。
if [ -z "$(find "$main_root/.agents/skills" -mindepth 1 -maxdepth 1 -type d 2>/dev/null)" ]; then
  (
    cd "$main_root"
    npx skills experimental_install
  )
fi

if [ "$worktree_root" != "$main_root" ]; then
  mkdir -p "$worktree_root/.agents/skills"
  cp -R "$main_root/.agents/skills/." "$worktree_root/.agents/skills/"
fi

(
  cd "$worktree_root/frontend"
  pnpm install --frozen-lockfile --config.confirmModulesPurge=false
)
'''

[[actions]]
name = "还原skills"
icon = "tool"
command = "npx skills experimental_install"

[[actions]]
name = "安装前端依赖"
icon = "tool"
command = "cd frontend && pnpm install --frozen-lockfile --config.confirmModulesPurge=false"

[[actions]]
name = "还原 .NET 依赖"
icon = "tool"
command = "dotnet restore backend/Nerv.IIP.sln && dotnet restore connector-hosts/Nerv.IIP.ConnectorHost.sln"

[[actions]]
name = "后端测试"
icon = "tool"
command = "dotnet test backend/Nerv.IIP.sln"

[[actions]]
name = "Connector Host测试"
icon = "tool"
command = "dotnet test connector-hosts/Nerv.IIP.ConnectorHost.sln"

[[actions]]
name = "前端质量门禁"
icon = "tool"
command = "pnpm -C frontend check && pnpm -C frontend lint && pnpm -C frontend fmt && pnpm -C frontend typecheck && pnpm -C frontend test && pnpm -C frontend build"

[[actions]]
name = "导出Gateway OpenAPI"
icon = "tool"
command = "pwsh scripts/export-gateway-openapi.ps1"

[[actions]]
name = "生成前端API Client"
icon = "tool"
command = "pnpm -C frontend generate:api"
